# ScholarlM experiment configuration
#
# defaults.seed is the repo-wide canonical seed. Every experiment config
# commits its own `seed` field, and every runner (run_extraction.py,
# run_ablation.py, run_attribution.py, run_representation_lm.py, run_ocr.py,
# and any other runner going through experiments/utils.py's `load_config()`)
# checks that value against this one (`["defaults"]["seed"]`, no fallback) and
# hard-fails on a mismatch before doing anything else. That check exists so a
# config can't silently drift onto a different seed than the one every other
# experiment in the repo runs under; utils.set_seeds() then seeds Python's
# `random`, NumPy, and (if available) PyTorch/CUDA from the experiment
# config's own seed for that run.
#
# Personal paths are NOT stored here.  Set the following environment
# variables in your cluster profile or a local .env file:
#
#   VLLM_SIF_DIR        - directory containing Singularity .sif images
#                         (the sif_image field below is the filename within it)
#   HF_CACHE            - HuggingFace weights cache directory
#   SINGULARITY_BIND    - bind-mount path argument for singularity exec
#   SCHOLARLM_ROOT      - absolute path to this repository root
#   TMPDIR              - temporary directory for Singularity jobs
#   SGE_PROJECT         - SGE project allocation name for the -P directive

defaults:
  seed: 342
