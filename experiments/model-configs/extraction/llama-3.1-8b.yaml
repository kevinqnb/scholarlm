model_id: meta-llama/Llama-3.1-8B-Instruct
sampling_params:
  temperature: 0.2
  top_p: 0.95
  top_k: 20
  max_tokens: 8192
  seed: 342
  enable_thinking: false
serve:
  port: 8081
  max_model_len: 90000
  gpu_memory_utilization: 0.9
  dtype: bfloat16
  sif_image: vllm-openai_v0.24.0.sif
resources:
  gpu_memory: 32G
  gpu_capability: 7.0
  # Pinned 2026-09-26 after job 7747755 (tinye2e-baseline-01) landed on a
  # Tesla V100S (compute capability 7.0, satisfies the bare floor above) and
  # vLLM refused to start: "Bfloat16 is only supported on GPUs with compute
  # capability of at least 8.0." serve.dtype: bfloat16 above needs Ampere+
  # regardless of the resources floor. Every other 7-8B model-config in this
  # repo already pins gpu_type for exactly this reason (interp_judge/
  # llama-3.1-8b.yaml, representation_lm/llama-3.1-8b-base.yaml,
  # nuextract3.yaml, both gliner-*.yaml) -- this one had not been updated to
  # match. L40S (sm_89) clears the real bf16 requirement; matches the
  # existing template used by those siblings.
  gpu_type: L40S
  omp: 8
