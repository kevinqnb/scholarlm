model_id: meta-llama/Llama-3.1-8B-Instruct
nnsight_kwargs:
  torch_dtype: bfloat16
sampling_params:
  do_sample: false
  max_new_tokens: 1
resources:
  gpu_memory: 32G
  gpu_capability: 7.0
  # Pinned explicitly, not just a capability floor: this cluster's installed
  # torch build (2.7.1+cu126) stops at sm_90, and a gpu_c floor alone let
  # similar 7-8B NNsight jobs land on newer incompatible GPU types -- see
  # notes/scholarlm/experiments/2026-08-11-llama-base-answer-cue-01.md, which
  # diagnosed this exact issue for the llama-3.1-8b family (an RTXP6000/
  # Blackwell node, sm_120, satisfied a gpu_c=7.0-only request and then failed)
  # and confirmed L40S as the fix.
  gpu_type: L40S
  # -l h_rt=24:00:00 -pe omp 8 -l gpus=1 -l gpu_memory=32G -l gpu_c=7.0 is read
  # directly off the actual llama-3.1-8b judge_interp qsub scripts once on disk
  # (gitignored scratch, since removed: experiments/{pond,nfix}/judge_interp/
  # llama_3_1_8b/*.sh), recorded verbatim in that same note -- not inferred by
  # analogy alone. That note predates the full-paper-judge-context restructure
  # (2026-09-08, commit e7da363), so llama-3.1-8b itself hasn't been directly
  # observed at full-paper prompt lengths; interp_judge/qwen-2.5-7b.yaml's own
  # resources block HAS (44.4 GiB observed, same 32G/L40S template, same era)
  # for a comparably-sized model with no RoPE-scaling overhead advantage over
  # Llama-3.1's native 128k context -- the template is expected to hold, but
  # that specific combination (this model x full-paper length) is inference,
  # not a direct observation. Re-check first if a real run here runs OOM.
  walltime: "24:00:00"
  omp: 8
