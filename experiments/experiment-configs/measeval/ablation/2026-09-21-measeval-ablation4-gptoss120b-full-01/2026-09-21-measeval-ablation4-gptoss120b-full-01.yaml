  doubly extrapolated: the ratio of ablation4's measured runtime to plain
  extraction's measured runtime, averaged across pond/nfix/supermat for
  gpt-oss-120b (the only real data available for this ablation+model
  combination), applied to measeval's own measured gpt-oss-120b extraction
  runtime. Treat this number as a placeholder, not a grounded estimate -- run a
  smoke and a tiny end-to-end on measeval/gpt-oss-120b/ablation4 before trusting
  it. Headroom applied per this matrix's graduated multiplier policy (4x under a
  3h base, 3x under 10h, 2x under 24h, 1.5x above that, floor 2h, ceiling to the
  next whole hour) -> 26:00:00. resume=true (matches the v1 extraction sibling;
  ablations share the same checkpointed-step machinery). STAGED-GATES: NO
  rung-1/2/3 pass exists for ablation4 on gpt-oss-120b/measeval under the
  current schema (only ablation1 and ablation3 on pond/gemma-3-27b have a
  tinye2e precedent at all, anywhere in this matrix). Per CLAUDE.md's
  staged-gate ladder, run a smoke and a tiny end-to-end with a predicted result
  on this exact triple before submitting this config.
seed: 342
