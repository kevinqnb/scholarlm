id: 2026-09-21-measeval-ablation4-gptoss120b-full-01
project: scholarlm
description: >
  Rung-4 full run of Ablation 4 (merged event+value extraction) on measeval,
  model=gpt-oss-120b (src/scholarlm/measurementlm_ablation4.py, via
  run_ablation.py). One cell of the 2026-09-21 full extraction-config matrix.
  Paper count: 448 (448 raw OCR files (train+trial+eval splits combined), no
  paper_filter/paper_exclude defined for measeval). ocr_dir omitted -- defaults
  to data/measeval/ocr_output_raw/; measeval has no table-cleaning or
