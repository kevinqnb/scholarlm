id: 2026-09-21-measeval-extraction-llama8b-full-01
project: scholarlm
description: >
  Rung-4 full run of the base MeasurementLM pipeline
  (src/scholarlm/measurementlm.py) on measeval, model=llama-3.1-8b. Drafted as
  one cell of a full 4-dataset x 3-model x {v1, v2, ablation1-6}
  extraction-config matrix (requested 2026-09-21); see sibling ids across
  experiments/experiment-configs/measeval/{extraction,extraction_v2,ablation}/
  for the rest. Paper count: 448 (448 raw OCR files (train+trial+eval splits
  combined), no paper_filter/paper_exclude defined for measeval). ocr_dir
  omitted -- defaults to data/measeval/ocr_output_raw/ (448 files); measeval has
  no table-cleaning run to point at (unlike pond/nfix/supermat), matching the
  one existing measeval full-extraction precedent
  (2026-08-01-measeval-llama-8b-01), which also ran against raw OCR. Walltime
  grounded in the last pre-restructure full run of this exact (dataset, model)
  pair:
  data/experiments/measeval/extraction/llama-3.1-8b/2026_08_01/run_metadata.json,
  runtime_seconds=19975.4 (5.55h). That legacy run predates the 2026-09-20
  qualifier-field schema rework (_parse_quantities and 7 new per-quantity
  fields), so its timing doesn't reflect the current per-record call pattern --
  headroom applied per this matrix's graduated multiplier policy (4x under a 3h
  base, 3x under 10h, 2x under 24h, 1.5x above that, floor 2h, ceiling to the
  next whole hour) -> originally 17:00:00. STAGED-GATES: NO rung-1/2/3
  pass exists for this exact (dataset, model) pair under the current
  (2026-09-20+) qualifier-field schema -- only gemma-3-27b has been
  smoke/tiny-e2e tested on this schema so far; this is exactly the staged-gate
  skip that bit here.
  UPDATE 2026-09-22 (job 7687209, killed by SGE at its 17h h_rt on scc-217, an
  A40): the legacy 5.55h estimate was badly wrong for llama-3.1-8b under the
  current qualifier-field schema. Real observed timing: Step 1 (entities)
  finished by ~1h in; Steps 2/3a/3b (attributes, entity_prov, attribute_prov)
  together took roughly another 12h, finishing around the 13h mark
  (entities.json/attributes.json/entity_prov.json/attribute_prov.json all
  checkpointed and verified non-empty/well-formed -- confirmed real progress,
  not a repeat of the collision corruption); Step 3c (event resolution) then
  ran for the remaining ~4h without finishing before the kill (no events.json
  ever appeared) -- vLLM's own throughput log during this run showed an
  unusually low ~200 tok/s aggregate across 8 concurrent requests for an 8B
  model on an A40, which may itself be worth a separate look. Walltime bumped
  to 48:00:00 for the resubmission: resume=true means the ~13h of
  already-checkpointed work (steps 1/2/3a/3b) is skipped, not redone, so this
  budget only needs to cover 3c onward -- but since 3c alone didn't finish in
  4h, this is still a rough, unverified estimate, not a grounded one. Monitor
  this run; it may need another bump.
seed: 342
params:
  dataset: measeval
  model: llama-3.1-8b
  step: final
  parse_quantities_context: value_only
  standardize_context: value_only
  walltime: "48:00:00"
