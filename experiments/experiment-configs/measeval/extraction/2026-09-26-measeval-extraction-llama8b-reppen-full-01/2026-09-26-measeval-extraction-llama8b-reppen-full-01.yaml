id: 2026-09-26-measeval-extraction-llama8b-reppen-full-01
project: scholarlm
description: >
  Rung-4 full run of the base MeasurementLM pipeline on measeval,
  model=llama-3.1-8b-reppen -- identical to
  2026-09-21-measeval-extraction-llama8b-full-01 (that config's own original
  full-pipeline params, git a52a6e5, before it was later repurposed in place
  to a step:final-only rerun; llama-3.1-8b-reppen has no prior checkpoints
  under any id, so a final-only rerun is not an option here regardless) in
  every respect except model: llama-3.1-8b-reppen, whose only difference from
  llama-3.1-8b.yaml is sampling_params.repetition_penalty: 1.1. Motivation:
  notes/scholarlm/experiments/2026-09-26-measeval-llama8b-reppen-tinye2e-01.md
  found llama-3.1-8b's base pipeline degenerating into a token-repetition
  loop in _detect_attributes on this exact document
  (S0019103512003533-5211), burning 4 full retries and returning zero
  attributes; repetition_penalty: 1.1 eliminated the loop on that document
  (463.2s -> 12.8s for the attributes step, 0 -> 10 records). That test
  covered only one step and one document within the ablation-7 pipeline
  variant -- this config extends the fix to the full 7-step pipeline (with
  standardization/parse-quantities/deduplication, unlike ablation 7) on the
  same dataset, unverified beyond the mechanism argument that
  repetition_penalty can only reduce wasted regeneration, never add cost.
  ocr_dir omitted -- defaults to data/measeval/ocr_output_raw/ (448 files,
  no paper_filter/paper_exclude), same corpus as every other measeval
  extraction/ablation config; measeval has no table-cleaning/drop_references
  run.
  Walltime: 48:00:00 -- the original full-pipeline config computed 17:00:00
  (graduated multiplier policy off a pre-restructure legacy timing), but the
  currently-committed llama-3.1-8b sibling
  (2026-09-21-measeval-extraction-llama8b-full-01, since repurposed to
  step:final) carries 48:00:00, evidently bumped after its own real
  post-schema-rework cost was observed (its run_metadata.json shows the
  events+values+final steps alone, the only ones with fresh timing on file,
  already at 127366.1s=35.38h -- events alone is 125863.5s=34.96h; entities/
  attributes/provenance's real cost is not captured in that same file, so
  even 48h may be tight for a genuinely fresh full run). Taking the larger of
  the two already-vetted numbers rather than trusting the smaller, staler
  one -- flagging this one specifically as the least confidently-bounded
  walltime of the four extraction configs in this batch, unlike pond/supermat
  whose original estimates were empirically validated as comfortable.
  resume=true so a walltime kill loses only steps not yet checkpointed.
  STAGED-GATES: NO rung-1/2/3 pass exists for llama-3.1-8b-reppen on the
  full (non-ablation-7) pipeline, on any dataset -- see the pond sibling
  config's identical caveat, and the walltime note above specifically. Do not
  submit this config before a smoke run and a tiny end-to-end with a
  predicted result on this specific (dataset, model) pair.
seed: 342
params:
  dataset: measeval
  model: llama-3.1-8b-reppen
  resume: true
  walltime: "48:00:00"
