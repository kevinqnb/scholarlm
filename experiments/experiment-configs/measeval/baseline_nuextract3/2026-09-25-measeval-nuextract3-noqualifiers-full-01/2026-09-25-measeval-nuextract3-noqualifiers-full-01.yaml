  seed, include_qualifiers=true there implicitly).

  ocr_dir/walltime copied verbatim from the baseline config -- this run's
  schema is a strict subset of the baseline's, so per-call output size can
  only be equal to or smaller than what already fit in the baseline's
  03:00:00 budget (itself an unvalidated placeholder per that config's own
  description, since no walltime precedent existed for this baseline+dataset
  pair at all).

  STAGED-GATES: rung 1 (unit tests -- tests/test_no_qualifiers_real_configs.py
  includes measeval in its stubbed-call NuExtract3 checks -- all passing) is
  done. No rung-2/3 pass exists for NuExtract3 on measeval at all, under ANY
  schema -- the baseline config this compares against was itself submitted
  without a smoke/tinye2e per its own description. Do not submit this config
  before a smoke and a tiny end-to-end with a predicted result pass on this
  exact pair.
seed: 342
params:
  dataset: measeval
  model: nuextract3
  include_qualifiers: false
  ocr_dir: data/measeval/ocr_output_raw
