id: 2026-09-25-measeval-nuextract3-noqualifiers-full-01
project: scholarlm
description: >
  Rung-4 full run of the NuExtract3 baseline on measeval, with
  params.include_qualifiers=false -- see
  2026-09-25-pond-nuextract3-noqualifiers-full-01 for the full mechanism.
  measeval.py gained its own DirectExtractionItemSchemaNoQualifiers (with
  its own model_rebuild() call, needed because of the Literal["measurement"]
  attribute field -- see the build note) /
  _DIRECT_EXTRACTION_PROMPT_NO_QUALIFIERS / nuextract_examples_no_qualifiers
