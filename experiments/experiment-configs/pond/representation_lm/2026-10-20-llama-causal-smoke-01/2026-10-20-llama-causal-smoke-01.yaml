id: 2026-10-20-llama-causal-smoke-01
project: scholarlm
description: >-
  Rung-2 smoke of the refactored CAUSAL (nnterp) RepresentationLM path:
  llama-3.1-8b-base on ONE pond paper (limit 1), key term "pond", +/-1-paragraph
  windows, mean pooling, full cleaning. Same paper and settings as
  2026-10-20-modernbert-smoke-02, so the known answer is 34 rows. Exercises the
  causal verify_read_point, including the new future-independence check. The
  bitwise old-vs-new regression was skipped (the 2026_08_31 artifact is not in
  this checkout), so old/new equivalence stays unproven.
seed: 342
params:
  dataset: pond
  model: llama-3.1-8b-base
  key_terms: [pond]
  layers: [0, 16, 32]            # embeddings, mid, post-final-norm (32 blocks)
  remove_references: true
  remove_tables: true
  remove_page_tags: true
  pooling: mean
  context_radius: 1
  overflow_policy: error
  limit: 1
  verify_read_point: true
  walltime: "00:45:00"
