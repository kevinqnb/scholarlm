id: 2026-09-21-pond-extraction-gemma27b-full-01
project: scholarlm
description: >
  Rung-4 full run of the base MeasurementLM pipeline
  (src/scholarlm/measurementlm.py) on pond, model=gemma-3-27b. Drafted as one
  cell of a full 4-dataset x 3-model x {v1, v2, ablation1-6} extraction-config
  matrix (requested 2026-09-21); see sibling ids across
  experiments/experiment-configs/pond/{extraction,extraction_v2,ablation}/ for
  the rest. Paper count: 115 (128 raw OCR files minus 13 paper_exclude entries
  (pond has no paper_filter)). ocr_dir pinned to
  experiments/results/pond/drop_references/2026-09-18-pond-table-cleaning-drop-references-01
  -- per instruction, MeasurementLM v1/v2 and ablations use the
  table-cleaning-based drop_references output (NOT the plain table_cleaning dir
  the pre-existing 2026-09-19 extraction_v2 full-run configs for this dataset
  point at; same file count either way, drop_references is a pure text
  post-process). Table-cleaning model and extraction model are independent
  choices -- this same corpus is used for all three extraction models on this
  dataset so numbers stay comparable across models. NOT the legacy-named
  data/pond/ocr_output_cleaned_gemma-3-27b (16 files -- a dev subset overlapping
  _TOP_PAPERS, not the corpus) directory some 2026-09-20/21 single-paper dev
  configs in this same tree point at -- that directory is a partial dev subset,
  not a full corpus, and would silently under-run a full extraction with no
  error. Walltime grounded in the last pre-restructure full run of this exact
  (dataset, model) pair:
  data/experiments/pond/extraction/gemma-3-27b/2026_05_05/run_metadata.json,
  runtime_seconds=31980.3 (8.88h). That legacy run predates the 2026-09-20
  qualifier-field schema rework (_parse_quantities and 7 new per-quantity
  fields), so its timing doesn't reflect the current per-record call pattern --
  headroom applied per this matrix's graduated multiplier policy (4x under a 3h
  base, 3x under 10h, 2x under 24h, 1.5x above that, floor 2h, ceiling to the
  next whole hour) -> 27:00:00. resume=true so a walltime kill loses only the
  steps not yet checkpointed, not the whole run. STAGED-GATES: A rung-1/2/3 pass
  for this exact (dataset, model) pair already exists under the current
  qualifier-field schema (see the tinye2e/seeddet siblings in this directory) --
  this is that sequence's rung-4 step.
seed: 342
params:
  dataset: pond
  model: gemma-3-27b
  ocr_dir: experiments/results/pond/drop_references/2026-09-18-pond-table-cleaning-drop-references-01
  resume: true
  walltime: "27:00:00"
