id: 2026-09-26-pond-extraction-llama8b-reppen-full-01
project: scholarlm
description: >
  Rung-4 full run of the base MeasurementLM pipeline on pond,
  model=llama-3.1-8b-reppen -- identical to
  2026-09-21-pond-extraction-llama8b-full-01 (that config's own original
  full-pipeline params, git a52a6e5, before it was later repurposed in place
  to a step:final-only rerun; llama-3.1-8b-reppen has no prior checkpoints
  under any id, so a final-only rerun is not an option here regardless) in
  every respect except model: llama-3.1-8b-reppen, whose only difference from
  llama-3.1-8b.yaml is sampling_params.repetition_penalty: 1.1 (see
  experiments/model-configs/extraction/llama-3.1-8b-reppen.yaml's own
  comment). Motivation: notes/scholarlm/experiments/2026-09-26-measeval-llama8b-reppen-tinye2e-01.md
  found llama-3.1-8b's base pipeline degenerating into a token-repetition
  loop in _detect_attributes on at least one document (measeval,
  S0019103512003533-5211), burning 4 full retries and returning zero
  attributes; repetition_penalty: 1.1 eliminated the loop on that document
  (463.2s -> 12.8s for the attributes step, 0 -> 10 records). That test
  covered only one step, one document, one dataset (measeval, ablation 7) --
  this config extends the fix to the full 7-step pipeline on pond, unverified
  beyond the mechanism argument that repetition_penalty can only reduce
  wasted regeneration, never add cost.
  ocr_dir pinned to
  experiments/results/pond/drop_references/2026-09-18-pond-table-cleaning-drop-references-01,
  same corpus as every other pond extraction/ablation config (115 papers: 128
  raw OCR files minus 13 paper_exclude entries, pond has no paper_filter).
  Walltime: 27:00:00, reused verbatim from
  2026-09-21-pond-extraction-llama8b-full-01's own original value -- that
  config's real observed cost once it actually ran
  (experiments/results/pond/extraction/2026-09-21-pond-extraction-llama8b-full-01/run_metadata.json,
  total_step_seconds=72282.3s=20.08h, all 7 steps ran fresh) fit comfortably
  inside its 27h budget, and repetition_penalty should only lower per-call
  cost, never raise it, so the same ceiling is a safe (if conservative) bound
  here too. resume=true so a walltime kill loses only steps not yet
  checkpointed.
  STAGED-GATES: NO rung-1/2/3 pass exists for llama-3.1-8b-reppen on the
  full (non-ablation-7) pipeline, on any dataset -- the only tiny-e2e
  evidence for this model variant is the single-document, single-step
  ablation-7 test cited above. Per CLAUDE.md's staged-gate ladder, do not
  submit this config before a smoke run and a tiny end-to-end with a
  predicted result on this specific (dataset, model) pair -- entities,
  attribute detection (unbatched here, unlike ablation 7's batched variant),
  provenance, events, and values are all untested with repetition_penalty at
  any scale.
seed: 342
params:
  dataset: pond
  model: llama-3.1-8b-reppen
  ocr_dir: experiments/results/pond/drop_references/2026-09-18-pond-table-cleaning-drop-references-01
  resume: true
  walltime: "27:00:00"
