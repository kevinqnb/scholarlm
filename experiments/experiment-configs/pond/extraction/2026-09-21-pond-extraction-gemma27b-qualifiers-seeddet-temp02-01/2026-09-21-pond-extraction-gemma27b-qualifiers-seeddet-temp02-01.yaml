id: 2026-09-21-pond-extraction-gemma27b-qualifiers-seeddet-temp02-01
project: scholarlm
description: >
  Rerun of the MeasurementLM v1 seed-determinism pair
  (2026-09-21-pond-extraction-gemma27b-qualifiers-seeddet-01/-02, see
  notes/scholarlm/experiments/2026-09-21-qualifiers-seeddet-01.md) after two
  fixes: (1) the shared base `_acall` in measurementlm.py now forwards
  `sampling_params["seed"]` via extra_body -- previously silently dropped
  for every caller of the base _acall (v1, ablations 1-6, NuExtract-v1,
  ChatExtract); (2) experiments/model-configs/extraction/gemma-3-27b.yaml's
  temperature lowered 0.6 -> 0.2 repo-wide. Testing hypothesis: comparing the
  original seeddet round's four gemma-3-27b runs (NuExtract3: 1 call, temp
  0.2, seeded -> identical; ChatExtract: 915 calls, temp 0.0 -> identical;
  v1: ~103 calls, temp 0.6, seed dropped -> diverged; v2: ~80 calls, temp
  0.6, seed correctly forwarded -> still diverged) is *consistent with*
  temperature-amplified vLLM float noise compounding across MeasurementLM's
  7-step chained pipeline being the dominant driver, rather than
  batching/AWQ-marlin nondeterminism or the missing seed -- but this pair is
  what actually tests that prediction, not a confirmed conclusion; if it
  still diverges at 0.2 the hypothesis is wrong or incomplete, not the run.
  Lowering temperature to 0.2 (not 0.0, per user decision -- this is not
  meant to reproduce ChatExtract's greedy regime, just test whether reducing
  sampling temperature closes most of the gap) is the cheap test. This changes the sampling
  method from every prior v1 run and invalidates their numbers for direct
  comparison -- flagged explicitly per CLAUDE.md's eval-adjacent-parameter
  caution, even though this is pipeline (not eval) code.
  Paired with sibling config
  2026-09-21-pond-extraction-gemma27b-qualifiers-seeddet-temp02-02: same
  seed (342), same params, same code, same input
  (trophic_status_and_threats.txt via ocr_dir), both run today. Comparison:
  this run's final.json diffed record-for-record against temp02-02's.
seed: 342
params:
  dataset: pond
  model: gemma-3-27b
  ocr_dir: data/pond/ocr_output_cleaned_gemma-3-27b
  paper_subset: ["trophic_status_and_threats"]
  walltime: "01:00:00"
