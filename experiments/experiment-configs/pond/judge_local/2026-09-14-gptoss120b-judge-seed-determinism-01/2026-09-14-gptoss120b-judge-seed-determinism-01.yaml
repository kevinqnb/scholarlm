id: 2026-09-14-gptoss120b-judge-seed-determinism-01
project: scholarlm
description: >-
  Seed-determinism sanity control (first of two identical reruns; compare
  against -02). gpt-oss-120b's vllm_judge model-config sets
  temperature=0.2, seed=342 since commit 30f8e79 -- the model-config's own
  comment states this seed "has NOT been empirically re-verified" the way
  pond's temperature=0.0 case was, and two experiment notes
  (2026-09-11-supermat-fulltext-judge-01, 2026-09-11-ablation1-fulltext-judge-calib-01)
  record this as a deliberately deferred gap: "reproducibility at
  temperature>0 under continuous batching is not guaranteed by the seed
  parameter alone." This run and -02 are byte-identical configs (same
  extraction_id, same seed, same model-config) run at full scale (4285
  rows) against the same extraction the documented 1-3/3882 flip rate was
  observed at -- deliberately NOT a small subset, since that rate is too
  rare for a small-N comparison to say anything (see session discussion).
  Neither run pins gpu_type (vllm_judge/gpt-oss-120b.yaml has no gpu_type
  pin, only gpu_capability: 8.0/gpu_memory: 80G) -- run_metadata.json's
  gpu_info must be checked identical between this run and -02 before any
  disagreement count is interpreted; a hardware mismatch invalidates the
  comparison rather than confirming or refuting determinism (this repo's
  own run history already shows this model-config landing on both an H200
  NVL and an RTX PRO 6000 Blackwell across two prior runs).
seed: 342
params:
  dataset: pond
  judge: gpt-oss-120b
  extraction_id: 2026-05-03-pond-gpt-oss-120b-ablation1-01
  walltime: "24:00:00"
