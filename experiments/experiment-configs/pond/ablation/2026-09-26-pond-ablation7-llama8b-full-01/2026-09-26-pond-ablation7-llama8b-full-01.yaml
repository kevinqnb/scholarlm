id: 2026-09-26-pond-ablation7-llama8b-full-01
project: scholarlm
description: >
  Rung-4 full run of Ablation 7 (no standardization/quantity-parsing/
  deduplication; src/scholarlm/measurementlm_ablation7.py, via run_ablation.py)
  on pond, model=llama-3.1-8b. Ablation 7 keeps the extraction pipeline (steps
  1-6: entities, entity provenance, attributes, attribute provenance, events,
  values) exactly as the base MeasurementLM does -- only the "final" step
  changes: units are left exactly as extracted (no LLM standardization call),
  every qualifier/shape field is written null instead of being parsed from the
  raw value (no LLM parse-quantities call), and no duplicate-merging happens.
  Paper count: 115 (128 raw OCR files minus 13 paper_exclude entries (pond has
  no paper_filter)). ocr_dir pinned to
  experiments/results/pond/drop_references/2026-09-18-pond-table-cleaning-drop-references-01
  -- the same table-cleaning-based drop_references corpus as this dataset's
  other extraction/ablation siblings. NO ablation7 run of any kind exists yet,
  for any dataset or model -- this ablation is brand new, so there is no
  historical runtime to ground against directly. Walltime instead uses the max
  of this exact (dataset, model) pair's own ablation 2/3/4/6 walltimes (pond +
  llama-3.1-8b: 56:00:00 / 66:00:00 / 40:00:00 / 23:00:00 -> max 66:00:00, from
  ablation 3), all of which are genuine full 7-step-pipeline runs via
  run_ablation.py (that runner has no step/resume/final_only partial-rerun
  machinery, unlike run_extraction.py -- several of whose own committed
  extraction/*-full-01 configs have since been repurposed into step:
  final-only reruns and no longer reflect full-pipeline cost; confirmed
  against experiments/results/pond/extraction/2026-09-21-pond-extraction-llama8b-full-01/run_metadata.json's
  real per-step breakdown, where "final" is only 859.7s of a 72282.3s total).
  Ablation 7 runs the identical steps 1-6 as ablations 2/3/4/6, and its own
  final step (null-fill, no dedup) is strictly cheaper than any of theirs
  (still a full standardize+parse_quantities+dedup, or a more expensive
  modified step elsewhere in the pipeline) -- so this max is a safe upper
  bound, not a measurement -> 66:00:00. STAGED-GATES: NO rung-1/2/3 pass exists
  for ablation 7 anywhere -- this is its first use at any scale. Per
  CLAUDE.md's staged-gate ladder, run a smoke and a tiny end-to-end with a
  predicted result on this exact triple before submitting this config.
seed: 342
params:
  dataset: pond
  model: llama-3.1-8b
  ablation: "7"
  ocr_dir: experiments/results/pond/drop_references/2026-09-18-pond-table-cleaning-drop-references-01
  walltime: "66:00:00"
