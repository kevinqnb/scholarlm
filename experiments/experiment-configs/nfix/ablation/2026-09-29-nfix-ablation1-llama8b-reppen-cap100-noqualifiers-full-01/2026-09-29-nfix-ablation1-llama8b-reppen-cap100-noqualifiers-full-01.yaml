id: 2026-09-29-nfix-ablation1-llama8b-reppen-cap100-noqualifiers-full-01
project: scholarlm
description: >
  Rung-4 full run of Ablation 1 (direct triple extraction, no qualifiers) on
  nfix with llama-3.1-8b-reppen (repetition_penalty 1.1), with a per-document
  cap of 100 records (params.max_items, a JSON-Schema maxItems enforced by
  vLLM's grammar backend). Replaces
  2026-09-26-nfix-ablation1-llama8b-reppen-noqualifiers-full-01, which never
  finished (two jobs, 44 h + 13 h, no output): llama-3.1-8b under json_schema
  decoding fails to ever close the "items" array on a large fraction of papers
  (327 of 479 requests hit the 600 s client timeout; reproduced on an L40S,
  same prompt/sampling: output is an unbounded, largely repetitive record list
  that reaches 32768 tokens without closing), and the OpenAI SDK's default
  max_retries=2 under _call_batch's max_retries=4 turned each such paper into
  up to ~2.5 h of dead decoding. repetition_penalty 1.0/1.2/1.25/1.3/1.4,
  presence/frequency penalties and temperature 0 were each tried on the
  looping papers and none reliably closes the array (higher values instead
  empty or garble the output). The cap bounds output size; it does NOT make the
  records correct -- a document that reaches exactly 100 records is truncated
  or padded with repeats, is recorded in run_metadata.json's capped_papers,
  and must be treated as suspect (report separately or exclude from the
  comparison against gemma/gpt-oss on the shared subset; do not dedupe-and-
  score it silently). Documents whose response failed validation contribute
  zero records and are recorded in failed_papers. Cap value: 100 is above
  every nfix per-paper count the gemma-27b no-qualifiers run produced (max 70,
  next 43), so a paper that legitimately has many records is not truncated;
  the price is that looping papers emit 100 padded records (~9-11k tokens,
  ~4-5 min/call, under the 600 s timeout). Not a clean single-variable
  comparison against any uncapped run: include_qualifiers=false,
  repetition_penalty 1.1 and the cap all differ from the qualifier-bearing
  2026-09-21-nfix-ablation1-llama8b-full-01, which also never finished.
  ocr_dir pinned to the same table-cleaned, references-dropped corpus as the
  gemma/gpt-oss arms. Walltime 12:00:00: 98 papers x <=~5 min worst case
  (every paper capped) = ~8.2 h, plus server start-up and margin.
  STAGED-GATES: rung 1 = tests/test_ablation1_max_items.py; rungs 2-3 =
  2026-09-29-nfix-ablation1-llama8b-reppen-cap100-noqualifiers-tinye2e-01
  (see its description for the prediction). Do not submit before that matches.
seed: 342
params:
  dataset: nfix
  model: llama-3.1-8b-reppen
  ablation: "1"
  include_qualifiers: false
  max_items: 100
  ocr_dir: experiments/results/nfix/drop_references/2026-09-18-nfix-table-cleaning-drop-references-01
  walltime: "12:00:00"
