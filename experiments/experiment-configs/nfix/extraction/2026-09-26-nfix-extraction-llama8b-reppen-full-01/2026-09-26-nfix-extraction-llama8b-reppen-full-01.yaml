id: 2026-09-26-nfix-extraction-llama8b-reppen-full-01
project: scholarlm
description: >
  Rung-4 full run of the base MeasurementLM pipeline on nfix,
  model=llama-3.1-8b-reppen -- identical to
  2026-09-21-nfix-extraction-llama8b-full-01 (that config's own original
  full-pipeline params, git a52a6e5, before it was later repurposed in place
  to a step:final-only rerun; llama-3.1-8b-reppen has no prior checkpoints
  under any id, so a final-only rerun is not an option here regardless) in
  every respect except model: llama-3.1-8b-reppen, whose only difference from
  llama-3.1-8b.yaml is sampling_params.repetition_penalty: 1.1. Motivation:
  notes/scholarlm/experiments/2026-09-26-measeval-llama8b-reppen-tinye2e-01.md
  found llama-3.1-8b's base pipeline degenerating into a token-repetition
  loop in _detect_attributes on at least one document (measeval,
  S0019103512003533-5211), burning 4 full retries and returning zero
  attributes; repetition_penalty: 1.1 eliminated the loop on that document.
  That test covered only one step, one document, one dataset (measeval,
  ablation 7) -- this config extends the fix to the full 7-step pipeline on
  nfix, unverified beyond the mechanism argument that repetition_penalty can
  only reduce wasted regeneration, never add cost.
  ocr_dir pinned to
  experiments/results/nfix/drop_references/2026-09-18-nfix-table-cleaning-drop-references-01,
  same corpus as every other nfix extraction/ablation config.
  Walltime: 72:00:00 -- the original full-pipeline config computed 18:00:00
  (graduated multiplier policy off a pre-restructure legacy timing), but the
  currently-committed llama-3.1-8b sibling
  (2026-09-21-nfix-extraction-llama8b-full-01, since repurposed to
  step:final) carries 72:00:00, evidently bumped after its own real
  post-schema-rework cost was observed (its run_metadata.json shows the
  events+values+final steps alone, the only ones with fresh timing on file,
  already at 17904.9s=4.97h, with entities/attributes/provenance's real cost
  not captured in that same file). Taking the larger of the two
  already-vetted numbers rather than trusting the smaller, staler one.
  repetition_penalty should only lower per-call cost, never raise it, so this
  remains a safe, if generous, ceiling. resume=true so a walltime kill loses
  only steps not yet checkpointed.
  STAGED-GATES: NO rung-1/2/3 pass exists for llama-3.1-8b-reppen on the
  full (non-ablation-7) pipeline, on any dataset -- see the pond sibling
  config's identical caveat. Do not submit this config before a smoke run and
  a tiny end-to-end with a predicted result on this specific (dataset, model)
  pair.
seed: 342
params:
  dataset: nfix
  model: llama-3.1-8b-reppen
  ocr_dir: experiments/results/nfix/drop_references/2026-09-18-nfix-table-cleaning-drop-references-01
  resume: true
  walltime: "72:00:00"
