id: 2026-09-21-nfix-extraction-gemma27b-full-01
project: scholarlm
description: >
  Rung-4 full run of the base MeasurementLM pipeline
  (src/scholarlm/measurementlm.py) on nfix, model=gemma-3-27b. Drafted as one
  cell of a full 4-dataset x 3-model x {v1, v2, ablation1-6} extraction-config
  matrix (requested 2026-09-21); see sibling ids across
  experiments/experiment-configs/nfix/{extraction,extraction_v2,ablation}/ for
  the rest. Paper count: 98 (265 raw OCR files; 101 pass _nfix_paper_filter
  (verified: the table-cleaning-based drop_references run this config points at
  was itself already scoped to exactly those 101 files -- confirmed by set
  comparison against dataset-configs/nfix.py's paper_filter, not assumed); minus
  3 more from paper_exclude = 98). ocr_dir pinned to
  experiments/results/nfix/drop_references/2026-09-18-nfix-table-cleaning-drop-references-01
  -- per instruction, MeasurementLM v1/v2 and ablations use the
  table-cleaning-based drop_references output (NOT the plain table_cleaning dir
  the pre-existing 2026-09-19 extraction_v2 full-run configs for this dataset
  point at; same file count either way, drop_references is a pure text
  post-process). Table-cleaning model and extraction model are independent
  choices -- this same corpus is used for all three extraction models on this
  dataset so numbers stay comparable across models. Walltime grounded in the
  last pre-restructure full run of this exact (dataset, model) pair:
  data/experiments/nfix/extraction/gemma-3-27b/2026_05_06/run_metadata.json,
  runtime_seconds=18748.1 (5.21h). That legacy run predates the 2026-09-20
  qualifier-field schema rework (_parse_quantities and 7 new per-quantity
  fields), so its timing doesn't reflect the current per-record call pattern --
  headroom applied per this matrix's graduated multiplier policy (4x under a 3h
  base, 3x under 10h, 2x under 24h, 1.5x above that, floor 2h, ceiling to the
  next whole hour) -> 16:00:00. resume=true so a walltime kill loses only the
  steps not yet checkpointed, not the whole run. STAGED-GATES: A rung-1/2/3 pass
  for this exact (dataset, model) pair already exists under the current
  qualifier-field schema (see the tinye2e/seeddet siblings in this directory) --
  this is that sequence's rung-4 step.
seed: 342
params:
  dataset: nfix
  model: gemma-3-27b
  ocr_dir: experiments/results/nfix/drop_references/2026-09-18-nfix-table-cleaning-drop-references-01
  step: final
  parse_quantities_context: value_only
  standardize_context: value_only
  walltime: "16:00:00"
