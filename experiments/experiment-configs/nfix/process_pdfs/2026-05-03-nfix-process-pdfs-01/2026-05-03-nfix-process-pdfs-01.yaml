description: >-
  Retroactive config reconstructed after the fact for the stored page images in data/nfix/processed_pdfs/; the original config was not kept. Walltime (24h) is a nominal value, not the original request. Whether resume/paper_subset were set originally is unknown, so neither is pinned.
