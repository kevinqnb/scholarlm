  == []; (3) the log''s ''N quantity/quantities could not be attributed ... dropped'' line (N = source
  quantities left unmatched) has N < 10% of the number of quantities in standardized.json, and no whole-group
  ''Validation error in contextualization response'' line; (4) final.json record count within [4, 16]
  (0.5x-2x of this model''s v1 count of 8 on this paper -- a guess at ''same order'', not derived); (5)
  analysis/postprocessing.py on the output reports 0 rows with unequal provenance list lengths. collection_max_tokens=2048
