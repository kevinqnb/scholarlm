id: 2026-09-21-supermat-extraction-llama8b-full-01
project: scholarlm
description: >
  Rung-4 full run of the base MeasurementLM pipeline
  (src/scholarlm/measurementlm.py) on supermat, model=llama-3.1-8b. Drafted as
  one cell of a full 4-dataset x 3-model x {v1, v2, ablation1-6}
  extraction-config matrix (requested 2026-09-21); see sibling ids across
  experiments/experiment-configs/supermat/{extraction,extraction_v2,ablation}/
  for the rest. Paper count: 142 (142 raw OCR files, no
  paper_filter/paper_exclude defined for supermat). ocr_dir pinned to
  experiments/results/supermat/drop_references/2026-09-18-supermat-table-cleaning-drop-references-01
  -- per instruction, MeasurementLM v1/v2 and ablations use the
  table-cleaning-based drop_references output (NOT the plain table_cleaning dir
  the pre-existing 2026-09-19 extraction_v2 full-run configs for this dataset
  point at; same file count either way, drop_references is a pure text
  post-process). Table-cleaning model and extraction model are independent
  choices -- this same corpus is used for all three extraction models on this
  dataset so numbers stay comparable across models. NOT the legacy-named
  data/supermat/ocr_output_cleaned_gemma-3-27b (1 file -- just
  PR05003221-CC.txt, the tinye2e test paper) directory some 2026-09-20/21
  single-paper dev configs in this same tree point at -- that directory is a
  partial dev subset, not a full corpus, and would silently under-run a full
  extraction with no error. Walltime grounded in the last pre-restructure full
  run of this exact (dataset, model) pair:
  data/experiments/supermat/extraction/llama-3.1-8b/2026_07_13/run_metadata.json,
  runtime_seconds=28533.2 (7.93h). That legacy run predates the 2026-09-20
  qualifier-field schema rework (_parse_quantities and 7 new per-quantity
  fields), so its timing doesn't reflect the current per-record call pattern --
  headroom applied per this matrix's graduated multiplier policy (4x under a 3h
  base, 3x under 10h, 2x under 24h, 1.5x above that, floor 2h, ceiling to the
  next whole hour) -> 24:00:00. resume=true so a walltime kill loses only the
  steps not yet checkpointed, not the whole run. STAGED-GATES: NO rung-1/2/3
  pass exists for this exact (dataset, model) pair under the current
  (2026-09-20+) qualifier-field schema -- only gemma-3-27b has been
  smoke/tiny-e2e tested on this schema so far. Per CLAUDE.md's staged-gate
  ladder, this should not be submitted before a unit test, a one-paper smoke
  run, and a tiny end-to-end pass with a predicted result on this specific
  (dataset, model) combination.
seed: 342
params:
  dataset: supermat
  model: llama-3.1-8b
  ocr_dir: experiments/results/supermat/drop_references/2026-09-18-supermat-table-cleaning-drop-references-01
  resume: true
  walltime: "24:00:00"
