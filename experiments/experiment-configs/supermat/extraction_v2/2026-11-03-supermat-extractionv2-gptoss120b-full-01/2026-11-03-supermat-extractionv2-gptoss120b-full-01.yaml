  rejects the key. Walltime 24:00:00: length-aware estimate of 11.9h from the gpt-oss-120b rung-3 tiny
  run (step_seconds quantities+standardized scaled by corpus characters / tiny-paper characters, final
  step scaled by the square of that ratio because per-quantity contextualization cost is quantities x
