  rests on one small paper per dataset and assumes no prefix-cache or cross-paper speedup; the supermat
  tiny paper (6 KB) is far smaller than the corpus median, so its scale factor is large and the estimate
  may be high; the final step is checkpointed only when it completes, so a walltime kill loses it entirely.
  resume=true, matching the v1 comparators. RUNG-3 GATE MET: the 2026-11-03 gpt-oss-120b tiny run on this
  dataset passed all five predictions (zero validation errors; no context overflow; contextualization
  drops under 10%; 7 records from 7 quantities, within the 0.5x-2x range of v1; 0 unequal provenance rows)
  with 0 ungrounded collected quantities and exactly one record per source quantity. That is structural
  evidence only on one paper; attribution correctness and recall are not yet checked. collection_max_tokens=2048
  records the output cap this run used (it was a hardcoded constant when the run was made; made an explicit
  param 2026-11-04).'
