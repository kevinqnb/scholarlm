  the v1 MeasurementLM id 2026-09-21-supermat-extraction-gptoss120b-full-01 (same dataset, model=gpt-oss-120b,
  ocr_dir, seed 342). ocr_dir is the table-cleaned, references-dropped corpus the v1 comparator read.
