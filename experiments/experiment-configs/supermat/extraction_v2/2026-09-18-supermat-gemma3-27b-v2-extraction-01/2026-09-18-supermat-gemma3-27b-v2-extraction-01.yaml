id: 2026-09-18-supermat-gemma3-27b-v2-extraction-01
project: scholarlm
description: >
  MeasurementLMv2 (quantity-first pipeline) full-dataset extraction,
  supermat, gemma-3-27b. First v2 run on this dataset. Known limitation
  carried over from the pond smoke test: contextualize-step entity
  over-attribution was reduced but not eliminated by the instruction fix in
  that build (see notes/scholarlm/builds/2026-09-18-measurementlmv2-01.md) --
  expect some shared-value quantities to over-expand across similar entities.
seed: 342
params:
  dataset: supermat
  model: gemma-3-27b
  # Id-addressed table_cleaning output. Table-cleaning model and extraction
  # model are independent choices -- OCR text is just text by this point.
  ocr_dir: experiments/results/supermat/table_cleaning/2026-07-09-supermat-table-cleaning-01
  resume: false
  # No solid v2 full-run timing exists yet -- the only v2 data point is a
  # 1-paper pond smoke test (~100s, explicitly unrepresentative), and v1's
  # single full supermat run on gemma-3-27b (different call pattern) took
  # 3.9h. Set to the safe 24h ceiling at the user's explicit request rather
  # than guessing a tighter number.
  walltime: "24:00:00"
