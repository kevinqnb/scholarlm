id: 2026-09-19-supermat-chatextract-gemma27b-full-01
project: scholarlm
description: >
  Rung-4 full run of the reworked ChatExtract baseline
  (src/scholarlm/measurementlm_chatextract.py) on all 142 supermat papers
  (paper_subset/paper_filter/paper_exclude all unset for this dataset).
  First full-scale supermat run since this session's rework: see
  notes/scholarlm/builds/2026-09-19-chatextract-rework-01.md /
  devlog/2026-09-19-chatextract-rework-01.md for the full list of changes.
  Also the first supermat full run to use a real chatextract_property_names
  phrase ("superconducting critical temperature") instead of the pre-rework
  bare "tc" fallback -- see this session's dataset-config completeness fix
  in experiments/dataset-configs/supermat.py. Rungs 1-3 all passed clean
  this session, including a tiny-e2e on this dataset (PHC3410729-CC: 7
  records here vs. the pre-rework run's 3 on the same paper, under the old
  "tc" phrasing).
  Walltime extrapolated from the pre-rework full supermat run
  (experiments/results/supermat/baseline_chatextract/2026-07-13-supermat-
  baseline-chatextract-01/run_metadata.json, runtime_seconds=1372.4 for the
  same 142-paper set, same extract_tables=true default): ~23min base,
  budgeted generously to a flat 2h floor given the small base estimate and
  the property-phrase fix's unmeasured effect on recovery volume. No
  incremental output: fit() returns once for the whole dataset before
  final.json is written, so a walltime kill loses the entire run, not a
  partial result.
seed: 342
params:
  dataset: supermat
  model: gemma-3-27b
  walltime: "02:00:00"
