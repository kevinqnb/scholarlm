  dataset: supermat
  judge: qwen-2.5-7b
  synthetic_file: data/supermat/probe_dataset_test_v3s.json
  ocr_dir: experiments/results/supermat/drop_references/2026-09-18-supermat-table-cleaning-drop-references-01
