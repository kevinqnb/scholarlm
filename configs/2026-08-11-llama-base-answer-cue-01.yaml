id: 2026-08-11-llama-base-answer-cue-01
project: scholarlm
description: >-
  Add an explicit plain-text answer cue to the llama-3.1-8b-base judge prompt
  and compare smooth ECE (relplot SmECE) against the llama-3.1-8b instruct
  judge baseline (pond+nfix only -- no no-cue llama-3.1-8b-base baseline is
  added in this experiment), across pond/nfix/supermat.
seed: 342
params:
  # No scripts/run_experiment.py adapter covers this workflow (extraction/
  # ablation only) -- same gap as every prior manual-entry-point precedent
  # (2026-08-05-qwen-base-judge-calibration-01, 2026-08-10-no-platt-scaling-01,
  # 2026-08-10-qwen-base-answer-cue-01). This config documents the run for
  # reproducibility; every step below is invoked directly via this repo's
  # native entry points, per the note's Setup section.
  entry_point: manual
  extraction_model: gemma-3-27b
  datasets: [pond, nfix, supermat]
  judge_model: llama-3.1-8b-base-cued
  answer_cue: "\n\nAnswer (true or false): "
  judge_date: "2026_08_11"
  extraction_dates:
    pond: "2026_05_05"
    nfix: "2026_05_06"
    supermat: "2026_07_09"
  probe_type: head
  use_platt_scaling: true
  train_layer_probe: false
  compare_against: [llama-3.1-8b]
  compare_against_datasets: [pond, nfix]  # llama-3.1-8b instruct baseline has no supermat coverage
  steps:
    - "experiments/{pond,nfix,supermat}/judge_interp/llama_3_1_8b_base_cued/*_judge_interp_synthetic_llama_3_1_8b_base_cued.sh -> run_judge_interp.py --dataset <ds> --synthetic --judge llama-3.1-8b-base-cued --judge-date 2026_08_11 (train+test, both splits in one invocation)"
    - "experiments/{pond,nfix,supermat}/judge_interp/llama_3_1_8b_base_cued/*_judge_interp_gemma_3_27b_llama_3_1_8b_base_cued.sh -> run_judge_interp.py --dataset <ds> --extraction-model gemma-3-27b --judge llama-3.1-8b-base-cued --extraction-date <pinned> --judge-date 2026_08_11"
    - "analysis/synthetic_probe_train_llama_3_1_8b_base_cued.sh -> analysis/synthetic_probe_train.py (DATASETS=[pond,nfix,supermat], JUDGE_MODELS=[llama-3.1-8b-base-cued], JUDGE_DATE_SYN=2026_08_11, USE_PLATT_SCALING=True, TRAIN_LAYER_PROBE=False) -> head_probe.pkl / ntp_calibrator.pkl per dataset"
    - "experiments/{pond,nfix,supermat}/judge/judge_combine_llama_3_1_8b_base_cued.sh -> run_judge_combine.py --dataset <ds> --extraction-model gemma-3-27b --extraction-date <pinned> (x3, auto-discover judges) -> combined.json with judgement_p_true_llama-3.1-8b-base-cued column"
    - "analysis/calibration_llama_3_1_8b_base_cued.sh -> analysis/calibration_updated.py --extraction-model gemma-3-27b --probe-type head --probe-variant platt (no --judge-models, full 6-judge recompute to avoid clobbering the CSV) -> results/metrics_gemma-3-27b_head_pooled.csv (SmECE column, Probe+NTP rows, all cells)"
    - "Reporting step (not a qsub job): filter metrics_gemma-3-27b_head_pooled.csv to judge in {llama-3.1-8b, llama-3.1-8b-base-cued} for the note's Results section; supermat rows for llama-3.1-8b-base-cued are descriptive only (no baseline row exists to compare against)"
  job_chain:
    # All 11 jobs submitted upfront in dependency order via -hold_jid (not
    # interactively, per this experiment's explicit request) -- see the note's
    # Implementation section for the resolved job IDs.
    - "6x judge_interp (synthetic x3 + real x3) -- no holds"
    - "1x synthetic_probe_train -- hold on the 3 synthetic judge_interp job IDs"
    - "3x judge_combine (pond, nfix, supermat) -- each held on (probe_train job ID, that dataset's real judge_interp job ID)"
    - "1x calibration -- held on (probe_train job ID, all 3 combine job IDs)"
