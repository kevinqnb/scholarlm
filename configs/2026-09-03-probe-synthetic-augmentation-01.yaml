id: 2026-09-03-probe-synthetic-augmentation-01
project: scholarlm
description: >-
  Synthetic augmentation of the judge probe train / primary-test / diagnostic
  datasets via gpt-oss-120b, for pond / nfix / supermat. Every ground-truth
  valid is carried through, and for each one gpt-oss (protocol 3: it picks the
  new value AND the minimal page edits) is asked for an equivalence-preserving
  rewrite along three axes -- entity name, measured value, measurement event
  (round 0). If the distinct-synthetic count is still below the 5000 floor
  (train) / 1000 floor (diagnostic) the axes are resampled at a raised
  temperature. Files usually END UP LARGER than the floor; invalids are then an
  equal number of direct measurement swaps from pre-generated per-type
  alternative pools (entity / attribute / value / units / event, evenly split),
  every valid and invalid row distinct by content. The primary-test file is
  held-out GT valids only (zero gpt-oss content) + the same typed negatives; the
  diagnostic file is built exactly like the train file on the held-out valids.
  Context-edited rows carry their edited page inline as context_override. Output
  files use the _v2 suffix; the non-augmented probe_dataset{,_test}.json are
  untouched.
seed: 42  # deliberate deviation from the repo-global 342 (experiments/config.yaml)
          # -- this is the actual --seed value every documented step below uses.
params:
  # No scripts/run_experiment.py adapter covers this workflow (entry_point
  # only supports extraction|ablation). Each dataset's create_probe_dataset.py
  # --augment is a native script, run via a hand-written qsub job that also
  # brings up the gpt-oss-120b vLLM server. This config documents the run for
  # reproducibility; see notes/scholarlm/builds/2026-09-03-probe-synthetic-
  # augmentation-01.md for the design rationale and the staged-gate history
  # (Rungs 1-2 pass; Rung 3 tiny real-gpt-oss yield check sets the per-dataset
  # prompt_budget_multiple below; Rung 4 is the full generation).
  entry_point: manual

  datasets: [pond, nfix, supermat]

  # gpt-oss-120b vLLM server, one job per dataset, brought up in-job by
  # inlining experiments/serve_gpt_oss_120b.sh's server invocation verbatim
  # (NOT gen_serve_script.py -- experiments/config.yaml's gpt-oss-120b serve
  # block has drifted from the working recipe, see the build note). Poll
  # /health before sending requests -- the endpoint file only means the process
  # started, not that weights are loaded.
  gpt_oss_api_base: http://localhost:8081/v1

  # SGE resources for the generation job (per dataset, one job). gpu_c=9.0 is a
  # real requirement: gpt-oss-120b's mxfp4 quantization needs Hopper-class
  # hardware. SCC's `-l gpu_c=` floor does NOT exclude Blackwell nodes
  # (sm_120 satisfies it) and Blackwell crashes torch+cu126 mid-forward
  # ([[env_blackwell_torch_cu126]]); A100 (sm_80) fails the gpu_c=9.0 floor
  # outright. H200 (sm_90) is the only gpu_type here that is >= gpu_c 9.0 and
  # not Blackwell -- pin it by exact `-l gpu_type=`. h_rt raised from the serve
  # script's 12h for the generation work that follows the serve step.
  job_resources:
    gpu_type: H200
    gpu_memory: 80G
    gpu_c: 9.0
    pe_omp: 16
    h_rt: "24:00:00"

  # Augmentation knobs.
  augment:
    pos_axes: [pos_entity, pos_value, pos_event]
    valid_floor: 5000            # MINIMUM train valids (GT carried + distinct synthetic)
    diag_valid_floor: 1000       # MINIMUM diagnostic valids; built exactly like train
    rewrite_temperature: 0.7     # one fixed regime; the resample round is in the cache key
    out_suffix: _v2
    # Attempt budget = n_gt_valids * n_axes * prompt_budget_multiple. multiple 1 =
    # round 0 only (one attempt per GT valid per axis, all kept). Falling short of
    # the floor inside the budget is a HARD ERROR.
    #
    # Set from Rung 3 (gen_aug_rung3.o7499062, 2026-09-08): round-0 distinct-yield
    # on an 80-GT-valid sample x 3 axes was pond 160/240 (67%), nfix 108/240
    # (45%), supermat 73/231 (32%). pos_event is largely dead for nfix/supermat
    # (ISO dates / pressures rarely appear verbatim on the page).
    #   pond    2 : round 0 (~3570 distinct) alone should clear the 3218 needed;
    #             multiple 2 is headroom against sample noise (retry cheap: cache
    #             persists, only the shortfall regenerates).
    #   nfix   10 / supermat 12 : heavy resampling. These may STILL not reach
    #             5000 distinct -- if a job fails "positive floor not met: X/5000",
    #             resubmit with --augment-valid-floor <just under X>.
    prompt_budget_multiple:
      pond: 2
      nfix: 10
      supermat: 12

  # Per-dataset invocation differs: nfix's baseline was re-pinned to the current
  # OCR corpus so --reviewed is required; supermat has no ground_truth_review.json.
  # supermat has no attribute error type (single measurand tc) and pos_event
  # never injects a pressure (unstated pressure means "ambient").
  #
  # experiments/gen_augment.sh (gitignored scratch, per the repo's *.sh ignore)
  # is the hand-written qsub job: it serves gpt-oss-120b, polls /health, then
  # runs the create_probe_dataset.py --augment client(s) in the same allocation.
  steps:
    # Rung 3 -- per-axis yield read, ~80 sampled GT valids/dataset, all three in
    # one job. Reads out `positive fill [<split>]: N distinct / M attempts`.
    - "qsub -N gen_aug_rung3 experiments/gen_augment.sh rung3"
    # Rung 4 -- full run, one job per dataset (so a floor-not-met failure on one
    # doesn't block the others). Multiples set from Rung 3 (see above).
    - "qsub -N gen_aug_pond     experiments/gen_augment.sh pond      # ... --augment --seed 42 --reviewed --augment-prompt-budget-multiple 2"
    - "qsub -N gen_aug_nfix     experiments/gen_augment.sh nfix      # ... --reviewed --augment-prompt-budget-multiple 10"
    - "qsub -N gen_aug_supermat experiments/gen_augment.sh supermat  # ... (no --reviewed) --augment-prompt-budget-multiple 12"
  # --augment-cache defaults to data/{ds}/probe_augment_cache.json (on by
  # default) -- the determinism artifact, since gpt-oss at temperature>0 with no
  # seed is not bit-reproducible. Protocol-3 + per-round `attempt` keys mean
  # every rewrite entry from the old protocol-2 cache is a permanent miss.

  # Output (per dataset, additional to the untouched defaults):
  #   probe_dataset_v2.json           (train: >=5000 valid + equal invalid, 50/50)
  #   probe_dataset_test_v2.json      (primary test: held-out GT valids + typed negatives)
  #   probe_dataset_test_v2_diag.json (diagnostic: built like train on held-out valids)
  #   probe_augment_cache.json        (gpt-oss response cache, content-hash keyed)
  #   probe_dataset*_v2*.json.diff.txt (unified diff report per split with edited rows)

  # Done = well-formedness / seed-determinism (x2) / diff-report spot-check /
  # prevalence / typed-negative-coverage / no-repeat-rows checks all pass on the
  # real gpt-oss output for all three datasets; the per-split unverified-span
  # fraction and the diagnostic-file edited-context-per-label split are recorded.
