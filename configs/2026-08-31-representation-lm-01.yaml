id: 2026-08-31-representation-lm-01
project: scholarlm
description: >-
  Collect last-layer (post-final-norm) representations for tokens matching the
  key-term vocabulary [pond, lake, wetland] across every non-excluded pond
  paper, using the llama-3.1-8b-base model under NNsight/nnterp. Artifact only
  (n x d representation array + labels + provenance); correctness of the
  representations is deferred to later analysis.
seed: 342
params:
  # No scripts/run_experiment.py adapter covers this workflow -- it only
  # supports entry_point extraction|ablation, and llama-3.1-8b-base is not in
  # the extraction MODEL_REGISTRY, so `bash scripts/submit.sh
  # 2026-08-31-representation-lm-01` FAILS resolving params.model. Same gap as
  # 2026-08-05-qwen-base-judge-calibration-01 /
  # 2026-08-29-measurement-before-context-01. This config documents the run
  # for reproducibility; the step below is invoked directly (native entry
  # point), via a hand-authored single-GPU qsub job the user submits.
  entry_point: manual

  dataset: pond
  model: llama-3.1-8b-base           # REPRESENTATION_LM_REGISTRY key
  key_terms: [pond, lake, wetland]

  # Independent regex known-answer prediction over the 115 non-excluded pond
  # papers (re.finditer(r'\b<term>s?\b', text, re.I); plurals included):
  #   pond 5807, lake 10105, wetland 1608  ->  total n = 17520 rows
  # llama-3.1-8b-base context is 131072 tokens vs ~10-15K per pond paper, so
  # the tail-truncation path should never fire (n_truncated == 0) and the
  # runner asserts n == 17520 exactly in that case.
  predicted_rows: 17520

  steps:
    - "python experiments/run_representation_lm.py --dataset pond --model llama-3.1-8b-base --key-terms pond lake wetland  ->  data/experiments/pond/representation_lm/llama-3.1-8b-base/<date>/representations.npz"
