id: 2026-09-11-supermat-fulltext-judge-01
project: scholarlm
description: >-
  Re-judge the existing supermat gemma-3-27b/2026_07_09 extractions with the
  three voting judges (gpt-oss-120b, qwen-2.5-72b, llama-3.3-70b) under the
  full-paper judge (e7da363), then majority-vote combine. supermat was left
  untouched by 2026-09-09-fulltext-judge-probe-eval-01 (pond only); this
  session applies the same full-paper-judge collection step to supermat.
  No probe/meta/synthetic work in scope -- collect + combine only. Motivated
  by a manual read of the existing (pre-full-paper) supermat combined.json
  for document 1802.03907-CC: table-4 rows there validate under several
  different entity names sharing the same table row, which looked like
  either a real multi-entity table or a duplication artifact -- full-paper
  context should let the judge tell those apart.
seed: 342  # repo-global (experiments/config.yaml), read via load_config()
params:
  entry_point: manual
  # No scripts/run_experiment.py adapter covers this (entry_point only
  # handles extraction|ablation, and this needs three sequential vLLM judge
  # servers). Each stage is a native entry point driven by a hand-written
  # qsub job. This config is the reproducibility record; queries + hypothesis
  # are in notes/scholarlm/experiments/2026-09-11-supermat-fulltext-judge-01.md
  # (written by /explog).

  dataset: supermat
  judge_date: "2026_09_11"   # label pinned by every new-output stage

  extraction:
    model: gemma-3-27b
    date: "2026_07_09"       # only committed supermat extraction; unchanged (not re-run)

  # ── Voting judges on the real extractions (full-paper judge) ─────────────
  # experiments/judge_real_voting_v2.sh <model> supermat 2026_07_09 2026_09_11
  # -- one self-contained qsub per model (serves in-allocation, polls
  # /health, runs run_judge_local.py against localhost, exits). Generalizes
  # experiments/judge_real_voting.sh (pond-only, 2026-09-09) to take
  # <dataset>/<extraction_date> explicitly rather than editing that script
  # in place (its own note/config already record the exact pond invocation).
  #
  # Then experiments/judge_combine_supermat_3vote.sh combines exactly the
  # three voters (explicit --judges, NOT auto-discover -- supermat already
  # has pre-full-paper judge dirs for llama-3.1-8b, mistral-7b, qwen-2.5-7b(-
  # base(-cued)) that auto-discover would otherwise sweep in).
  judge_real_voting:
    voters: [gpt-oss-120b, qwen-2.5-72b, llama-3.3-70b]
    combine_judges: [gpt-oss-120b, qwen-2.5-72b, llama-3.3-70b]
    entry_point: judge_real_voting_v2.sh + run_judge_combine.py
    voting_threshold: 2   # ceil(3/2), run_judge_combine.py default
    serve_gpu_type: H200
    qwen_2_5_72b_context: |
      DEVIATION from the pond config (2026-09-09-fulltext-judge-probe-eval-01),
      which used YaRN factor 2.0 (max_position_embeddings 65536): measured
      (real tokenizer, offline, this session) supermat's longest OCR file
      (hott2013review-CC, 209082 chars) at 68242 Qwen tok / 62763 Llama tok /
      61831 gpt-oss tok. Judge system+query overhead measured at ~830 tok
      (698 system + ~130 query) -- confirmed against judge_common.py's actual
      JUDGE_INSTRUCTIONS + build_judge_query, not assumed. 68242 + 830 + 8192
      (max_tokens) = 77264 > 65536 -> pond's setting would abort the run on
      this one paper (same failure mode pond hit before its own YaRN fix).
      Fix: factor 2.0 -> 3.0 (max_position_embeddings 98304, --max-model-len
      98304), dataset-conditioned in judge_real_voting_v2.sh so pond's
      recorded config/numbers are untouched.
      Checked against vLLM's actual measured KV-cache pool for this exact
      model/GPU/quant (pond job 7515830 log: "GPU KV cache size: 273,296
      tokens" at max_model_len=65536) -- 98304 leaves room for ~2.8
      concurrent full-length sequences, not just one; not a guess.
      llama-3.3-70b / gpt-oss-120b: 128k-native, unscaled, max-model-len
      90000 unchanged -- supermat's longest file is 62763 / 61831 tok on
      their tokenizers, comfortably under with the same overhead + budget.
      This is a serve config change, not a change to judge/metric logic.

  # ── Non-destructive snapshot (taken before the combine job runs) ─────────
  snapshot:
    dir: /projectnb/mcnet/kevin/tmp/scholarlm_baseline_snapshot_2026_09_11
    contents:
      - data/experiments/supermat/judge/gemma-3-27b/2026_07_09/combined/combined.json

  # ── Staged-gate ladder ─────────────────────────────────────────────────
  ladder:
    rung_1_unit_tests: "uv run --extra dev pytest -- 307 passed / 1 skipped, no code changes in scope"
    rung_2_3_smoke_and_known_answer: >-
      experiments/judge_smoke_check.sh <model>, one per voting judge. Serves
      the model with the exact rung-4 settings, then sends 3 requests built
      via judge_common.prepare_chat_entries against real rows (not a
      hand-built fixture): (a) a hott2013review-CC row -- catches context
      overflow; (b) measurement_id 26 (Sr2VFeAsO3-delta, 1802.03907-CC table
      4, tc onset 34.9K) -- PREDICTED VALID; (c) measurement_id 3363
      (Sr2ScFeAsO3, same table row/value) -- PREDICTED INVALID. Stated in
      advance, per the hypothesis below. Mismatch on (b)/(c) stops the
      session before rung 4; failure on (a) means the context fix is wrong.
    rung_4_full: "the full job graph below"

  # ── Sanity controls ───────────────────────────────────────────────────
  sanity_controls:
    known_answer:
      check: "rung 2/3 smoke prediction on measurement_id 26 vs 3363 (see above)"
      expected: "26 -> valid, 3363 -> invalid"
    seed_determinism:
      check: "re-run judge_smoke_check.sh for one model a second time (same 3 requests) and diff responses text"
      expected: "byte-identical model responses (temperature=0.0, fixed seed=342)"
    shuffled_label_document_swap:
      status: DEFERRED
      note: >-
        Document-shuffle control (pair 1802.03907-CC's rows with a different
        paper's text; validity should collapse) proposed and explicitly
        declined for this session's scope -- see the /experiment
        AskUserQuestion response, 2026-09-11. Known gap, same as pond's
        deferred shuffled-label control.

  # ── SGE job graph (ids filled in as submitted) ────────────────────────
  jobs:
    smoke_gpt_oss_120b: 7525830
    smoke_qwen_2_5_72b: 7525831
    smoke_llama_3_3_70b: 7525832
    judge_real_gptoss: 7527735
    judge_real_qwen72: 7527736
    judge_real_llama70: 7527737
    judge_combine_supermat: 7527738   # -hold_jid on the three above

  code:
    # this session, branch diff-experiments -- all gitignored scratch, no
    # committed-code changes (no eval/metric logic touched)
    - "experiments/judge_smoke_check.sh + scratchpad judge_smoke_check.py (rung 2/3)"
    - "experiments/judge_real_voting_v2.sh (generalizes judge_real_voting.sh with <dataset>/<extraction_date> args + supermat-conditioned qwen YaRN factor)"
    - "experiments/judge_combine_supermat_3vote.sh"
