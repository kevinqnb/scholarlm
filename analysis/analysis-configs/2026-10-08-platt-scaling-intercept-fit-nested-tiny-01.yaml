id: 2026-10-08-platt-scaling-intercept-fit-nested-tiny-01
project: scholarlm
description: >
  Rung-3 tiny end-to-end for the nested-bootstrap Platt-n sweep (analysis/platt_scaling.py):
  same inputs, seed and recalibration (intercept_fit) as
  2026-10-07-calibration-v3-gemma27b-qwen-2.5-7b-intercept-fit-nested-tiny-01, 10 fit samples x
  10 test-document resamples, platt_ns [10, 100]. Known answer: the n=100 rows reproduce that v3
  run's real-cell SmECE / ECE / ECE_em / RMSCE_db point, lo and hi (to ~1e-9) in all 18 cells,
  and its Test N / label rate exactly. Predicted: n=10 needs more than 10 draws for nfix
  (single-class skips) and its intervals are wider than n=100's in most cells.
seed: 0
params:
  probe_type: head
  probe_variant: platt
  syn_split: primary
  platt_ns: [10, 100]
  recalibration: intercept_fit
  n_fit_samples: 10
  n_doc_boot: 10
  datasets:
    pond:
      extraction_id: 2026-09-22-pond-extraction-gemma27b-parseqty-standardization-valueonly-01
      judge_interp_id: 2026-09-27-pond-extraction-gemma27b-parseqty-standardization-valueonly-qwen7b-judge-interp-01
      judge_combine_id: 2026-09-27-pond-extraction-gemma27b-parseqty-standardization-valueonly-judge-combine-01
      ground_truth_file: data/pond/ground_truth_review.json
      synthetic_probe_config: 2026-10-02-pond-synthetic-probe-qwen-2.5-7b-v3-01
      use_matching_labels: true
      syn_test_ids:
        primary: 2026-09-30-pond-v3-qwen-2.5-7b-synthetic-judge-test-primary-01
        diag: 2026-09-30-pond-v3-qwen-2.5-7b-synthetic-judge-test-diag-01
    nfix:
      extraction_id: 2026-09-21-nfix-extraction-gemma27b-full-01
