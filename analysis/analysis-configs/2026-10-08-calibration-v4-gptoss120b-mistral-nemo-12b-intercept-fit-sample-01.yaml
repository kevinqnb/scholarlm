id: 2026-10-08-calibration-v4-gptoss120b-mistral-nemo-12b-intercept-fit-sample-01
project: scholarlm
description: >
  Calibration analysis v4 (analysis/calibration_updated_v4.py) for the mistral-nemo-12b interp judge
  over the gptoss120b full-pipeline extractions: identical procedure and params to
  2026-10-08-calibration-v4-gemma27b-qwen-2.5-7b-intercept-fit-sample-01 (intercept-only recalibration,
  slope 1, intercept by MLE, fit once on 100 real rows drawn uniformly (fit_seed 0) from each
  test dataset's probe-training pool; 2000 test-document cluster resamples, seed 0) -- only the
  extraction / judge inputs differ, so the fit rows are this extraction's own pool rows.
  Run: bash analysis/submit.sh calibration_v4 2026-10-08-calibration-v4-gptoss120b-mistral-nemo-12b-intercept-fit-sample-01 --walltime 04:00:00 --omp 4
  Supermat uses the v3 (pre-v3s) synthetic probe/test ids, like the reference -- supermat
  numbers are invalid until switched to the v3s supermat probe; see the supermat v3s split realign.
seed: 0
