id: 2026-10-08-platt-scaling-v2-intercept-fit-tiny-02
project: scholarlm
description: >
  Rung-3 tiny end-to-end for the n = 0 baseline (analysis/platt_scaling_v2.py): platt_ns [0, 50,
  1000], 100 train resamples, intercept_fit, same inputs and seed as
  2026-10-08-platt-scaling-v2-intercept-fit-tiny-01. Known answers: fit samples depend only on
  (seed, dataset, n, resample), so the n = 50 and n = 1000 per-resample rows are byte-identical to
  tiny-01's; the n = 0 rows equal relplot smECE of the raw test scores, with zero-width intervals.
