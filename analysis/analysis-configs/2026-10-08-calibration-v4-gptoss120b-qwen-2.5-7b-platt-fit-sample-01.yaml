id: 2026-10-08-calibration-v4-gptoss120b-qwen-2.5-7b-platt-fit-sample-01
project: scholarlm
description: >
  Calibration analysis v4 with platt_fit recalibration (slope and intercept by
  unregularized logistic MLE) for the qwen-2.5-7b interp judge over the gptoss120b
  full-pipeline extractions. Identical to
  2026-10-08-calibration-v4-gptoss120b-qwen-2.5-7b-intercept-fit-sample-01 (same 100 fit
  rows per dataset, fit_seed 0; 2000 test-document resamples, seed 0) except
  recalibration: platt_fit. The slope is recalibration_maps.csv's coef column.
  Run: bash analysis/submit.sh calibration_v4 2026-10-08-calibration-v4-gptoss120b-qwen-2.5-7b-platt-fit-sample-01 --walltime 04:00:00 --omp 4
  Supermat uses the v3 (pre-v3s) synthetic probe/test ids -- supermat numbers are invalid
  until switched to the v3s supermat probe.
seed: 0
params:
  probe_type: head
  probe_variant: platt
  syn_split: primary
  n_boot: 2000
  recalibration: platt_fit
  fit_source: sample
  fit_n: 100
  fit_seed: 0
  datasets:
    pond:
      extraction_id: 2026-09-21-pond-extraction-gptoss120b-full-01
      judge_interp_id: 2026-09-27-pond-extraction-gptoss120b-qwen7b-judge-interp-01
      judge_combine_id: 2026-09-27-pond-extraction-gptoss120b-judge-combine-01
      ground_truth_file: data/pond/ground_truth_review.json
      synthetic_probe_config: 2026-10-02-pond-synthetic-probe-qwen-2.5-7b-v3-01
      use_matching_labels: true
      pi_te_estimate: null
      syn_test_ids:
        primary: 2026-09-30-pond-v3-qwen-2.5-7b-synthetic-judge-test-primary-01
        diag: 2026-09-30-pond-v3-qwen-2.5-7b-synthetic-judge-test-diag-01
    nfix:
      extraction_id: 2026-09-25-nfix-extraction-gptoss120b-full-02
      judge_interp_id: 2026-09-27-nfix-extraction-gptoss120b-qwen7b-judge-interp-01
      judge_combine_id: 2026-09-27-nfix-extraction-gptoss120b-judge-combine-01
      ground_truth_file: data/nfix/ground_truth_review.json
      synthetic_probe_config: 2026-10-02-nfix-synthetic-probe-qwen-2.5-7b-v3-01
      use_matching_labels: true
      pi_te_estimate: null
      syn_test_ids:
        primary: 2026-09-30-nfix-v3-qwen-2.5-7b-synthetic-judge-test-primary-01
        diag: 2026-09-30-nfix-v3-qwen-2.5-7b-synthetic-judge-test-diag-01
    supermat:
      extraction_id: 2026-09-21-supermat-extraction-gptoss120b-full-01
      judge_interp_id: 2026-09-27-supermat-extraction-gptoss120b-qwen7b-judge-interp-01
      judge_combine_id: 2026-09-27-supermat-extraction-gptoss120b-judge-combine-01
      ground_truth_file: data/supermat/ground_truth_qualifiers.json
      synthetic_probe_config: 2026-10-02-supermat-synthetic-probe-qwen-2.5-7b-v3-01
      use_matching_labels: true
      pi_te_estimate: null
      syn_test_ids:
        primary: 2026-09-30-supermat-v3-qwen-2.5-7b-synthetic-judge-test-primary-01
