id: 2026-10-06-pond-meta-dedup-01
project: scholarlm
description: >
  Full run (n_boot=2000). Meta-analysis on the pond full-pipeline extraction, using the DEDUPLICATED rows (2026-10-06-pond-deduplication-01); a kept row takes its cluster center's confidence.
  Confidences are the Platt-scaled pond->pond real-cell probe / NTP predictions stored
  by analysis/calibration_updated_v3.py in 2026-10-04-calibration-v3-gemma27b-qwen-2.5-7b-v3-01/predictions.pkl
  (nothing is recomputed); that calibration config is the source of truth for the
  extraction, judge runs, ground truth and probe. Every row's numeric value is its
  parsed point_value. seed 0 matches the legacy meta_updated.py default.
  Run: python analysis/meta_updated.py analysis/analysis-configs/2026-10-06-pond-meta-dedup-01.yaml
seed: 0
params:
  meta:
    calibration_config_id: 2026-10-04-calibration-v3-gemma27b-qwen-2.5-7b-v3-01
    rows: deduplicated
    deduplication_config_id: 2026-10-06-pond-deduplication-01
    confidence: center
    n_boot: 2000
    reference: ground_truth
    ecosystems: [pond, lake, wetland]
    attributes: [surface_area, max_depth, vegetation_cover, ph, tn, tp, chla]
    qq_attributes: [surface_area, ph, tn, tp]
    poster: true
