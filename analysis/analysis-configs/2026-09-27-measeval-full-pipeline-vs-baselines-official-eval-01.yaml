id: 2026-09-27-measeval-full-pipeline-vs-baselines-official-eval-01
project: scholarlm
description: >
  Official MeasEval (SemEval-2021 Task 8) scorer inputs for the main
  pipeline's latest full measeval runs (llama-3.1-8b-reppen, gemma-3-27b,
  gpt-oss-120b), their ablation1-noqualifiers and ablation7 counterparts, and
  the latest full baseline runs (langextract, gliner, nuextract3,
  chatextract). Feeds analysis/measeval_evaluation.py's --config mode, not
  analysis/recovery_validity.py -- this is NOT a recovery/validity
  comparison, so there's no compute_validity/n_resamples/alpha knob here.
  seed is required by the shared analysis-config envelope but is otherwise
  unused: measeval_evaluation.py's official scorer has no bootstrap/resample
  step to seed. ground_truth_file points at data/measeval/raw/data/eval/tsv (a
  directory, not the CSV/JSON the loader's docstring describes -- it's the
  official eval-split gold directory, listed here only because the shared
  loader requires params.ground_truth_file to exist; measeval_evaluation.py's
  --config path never reads this field itself, since evaluate() always scores
  against that same directory internally) rather than this repo's own
  data/measeval/ground_truth.json, which is this repo's recovery/validity
  ground truth and would be the wrong gold to hand the official scorer.
  Every id below spans train+trial+eval documents (checked 2026-09-27 against
  data/measeval/directory.json), but evaluate(dev=False) (2026-09-27,
  commit b074945) now filters each run down to its own eval-split documents
  before scoring rather than raising, so dev=false here produces a real,
  leaderboard-comparable number per id -- see the excluded_non_eval count
  printed per id for how many train/trial documents/records were dropped.
seed: 342
params:
  ground_truth_file: data/measeval/raw/data/eval/tsv
  experiment_ids:
    - 2026-09-26-measeval-extraction-llama8b-reppen-full-01
    - 2026-09-21-measeval-extraction-gemma27b-full-01
    - 2026-09-21-measeval-extraction-gptoss120b-full-01
    - 2026-09-26-measeval-ablation1-llama8b-reppen-noqualifiers-full-01
    - 2026-09-25-measeval-ablation1-gemma27b-noqualifiers-full-01
    - 2026-09-26-measeval-ablation1-gptoss120b-noqualifiers-full-01
    - 2026-09-26-measeval-ablation7-llama8b-reppen-full-01
    - 2026-09-26-measeval-ablation7-gemma27b-full-01
    - 2026-09-26-measeval-ablation7-gptoss120b-full-01
    - 2026-09-25-measeval-langextract-gemma27b-noqualifiers-full-01
    - 2026-09-25-measeval-gliner-large-noqualifiers-full-01
    - 2026-09-25-measeval-nuextract3-noqualifiers-full-01
    - 2026-09-26-measeval-chatextract-gemma27b-full-01
  measeval_evaluation:
    dev: false
    output: analysis/results/recovery-validity/2026-09-27-measeval-full-pipeline-vs-baselines-official-eval-01.csv
