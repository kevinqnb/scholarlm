id: 2026-10-07-pond-meta-dedup-pondlake-01
project: scholarlm
description: >
  Full run (n_boot=2000). Same inputs as 2026-10-06-pond-meta-dedup-01 (deduplicated rows from
  2026-10-06-pond-deduplication-01, cluster-center confidence, Platt-scaled pond->pond
  real-cell probe / NTP predictions from 2026-10-04-calibration-v3-gemma27b-qwen-2.5-7b-v3-01),
  restricted to the pond and lake ecosystems and to surface_area, max_depth, ph, chla --
  the cells with the most ground-truth documents (2026-10-06 audit: pond tn/tp/chla rest
  on 3-4 GT documents and wetland on at most 3, so their weighted Q-Q/W2 effects are
  between-document reweighting). Wetland is dropped entirely; no poster figure (its
  fixed cell is pond tn). Bootstrap CIs for retained cells are identical to
  2026-10-06-pond-meta-dedup-01; w2_shuffled is not (shared sequential rng).
  Run: python analysis/meta_updated.py analysis/analysis-configs/2026-10-07-pond-meta-dedup-pondlake-01.yaml
seed: 0
params:
  meta:
    calibration_config_id: 2026-10-04-calibration-v3-gemma27b-qwen-2.5-7b-v3-01
    rows: deduplicated
    deduplication_config_id: 2026-10-06-pond-deduplication-01
    confidence: center
    n_boot: 2000
    reference: ground_truth
    ecosystems: [pond, lake]
    attributes: [surface_area, max_depth, ph, chla]
    qq_attributes: [surface_area, max_depth, ph, chla]
    poster: false
