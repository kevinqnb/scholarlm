id: 2026-10-10-platt-scaling-gemma27b-qwen-2.5-7b-intercept-fit-01
project: scholarlm
description: >
  SmECE vs recalibration sample size (analysis/platt_scaling.py) for the qwen-2.5-7b probe / NTP on the gemma27b
  extractions of pond, nfix and supermat (supermat probe on the v3s split). n = 0 is the no-recalibration baseline
  (raw scores, one value); n = 100 and 500 are intercept_fit maps, each fit on 2000 training-pool resamples (pool
  documents resampled, then n rows drawn) and scored on the fixed real test rows; point = mean, interval = 2.5/97.5
  percentiles over those resamples (training-resample variability only). Re-run of 2026-10-09-platt-scaling-gemma27b-qwen-2.5-7b-intercept-fit-01: NTP is the judge's raw p(true), recalibrated only here (no synthetic-trained calibrator, commit cc3036f); Platt-family logit clip 1e-10 (commit b8b5949); head probes from the 2026-10-10 synthetic-probe re-runs.
seed: 0
params:
  probe_type: head
  probe_variant: platt
  syn_split: primary
  platt_ns: [0, 100, 500]
  recalibration: intercept_fit
  n_train_resamples: 2000
  datasets:
    pond:
      extraction_id: 2026-09-22-pond-extraction-gemma27b-parseqty-standardization-valueonly-01
      judge_interp_id: 2026-09-27-pond-extraction-gemma27b-parseqty-standardization-valueonly-qwen7b-judge-interp-01
      judge_combine_id: 2026-09-27-pond-extraction-gemma27b-parseqty-standardization-valueonly-judge-combine-01
      ground_truth_file: data/pond/ground_truth_review.json
      synthetic_probe_config: 2026-10-10-pond-synthetic-probe-qwen-2.5-7b-01
      use_matching_labels: true
      syn_test_ids: {primary: 2026-09-30-pond-v3-qwen-2.5-7b-synthetic-judge-test-primary-01, diag: 2026-09-30-pond-v3-qwen-2.5-7b-synthetic-judge-test-diag-01}
    nfix:
      extraction_id: 2026-09-21-nfix-extraction-gemma27b-full-01
      judge_interp_id: 2026-09-27-nfix-extraction-gemma27b-qwen7b-judge-interp-01
      judge_combine_id: 2026-09-27-nfix-extraction-gemma27b-judge-combine-01
      ground_truth_file: data/nfix/ground_truth_review.json
      synthetic_probe_config: 2026-10-10-nfix-synthetic-probe-qwen-2.5-7b-01
      use_matching_labels: true
      syn_test_ids: {primary: 2026-09-30-nfix-v3-qwen-2.5-7b-synthetic-judge-test-primary-01, diag: 2026-09-30-nfix-v3-qwen-2.5-7b-synthetic-judge-test-diag-01}
    supermat:
      extraction_id: 2026-09-21-supermat-extraction-gemma27b-full-01
      judge_interp_id: 2026-09-27-supermat-extraction-gemma27b-qwen7b-judge-interp-01
      judge_combine_id: 2026-09-27-supermat-extraction-gemma27b-judge-combine-01
      ground_truth_file: data/supermat/ground_truth_qualifiers.json
      synthetic_probe_config: 2026-10-10-supermat-synthetic-probe-qwen-2.5-7b-01
      use_matching_labels: true
      syn_test_ids: {primary: 2026-10-08-supermat-v3s-qwen-2.5-7b-synthetic-judge-test-primary-01, diag: 2026-10-08-supermat-v3s-qwen-2.5-7b-synthetic-judge-test-diag-01}
