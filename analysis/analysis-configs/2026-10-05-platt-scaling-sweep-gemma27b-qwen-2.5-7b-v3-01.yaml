id: 2026-10-05-platt-scaling-sweep-gemma27b-qwen-2.5-7b-v3-01
project: scholarlm
description: >
  DRAFT. Platt-sample-size sweep (analysis/platt_scaling.py) over the same probe /
  NTP calibrator / extractions / judge runs as
  2026-10-04-calibration-v3-gemma27b-qwen-2.5-7b-v3-01 (platt probe variant, head
  probe). For each (train probe, test dataset, method), n_trials independent random
  draws of the Platt rows are taken from the same pool v3 uses (that dataset's real
  rows whose document was in its own synthetic-probe training set); within a trial the
  platt_ns samples are nested prefixes of one permutation. Each scaler is scored by
  smECE on a fixed held-out set of real rows (outside the pool and the train probe's
  documents). The plotted curve is the mean over trials with a central ci interval
  over trials. Real setting only; synthetic cells are never Platt-scaled.
  Caveats: the band reflects Platt-sample variance only, not test-set resampling; at
  n >= pool size every trial draws the same rows, so the band collapses to zero (see
  Pool N in the CSV); single-class samples are dropped and counted (n_used);
  fit_platt is unregularized, so tiny samples may be separable and give extreme scalers.
  Run: bash analysis/submit.sh platt_scaling 2026-10-05-platt-scaling-sweep-gemma27b-qwen-2.5-7b-v3-01 --walltime HH:MM:SS --omp N
seed: 0
