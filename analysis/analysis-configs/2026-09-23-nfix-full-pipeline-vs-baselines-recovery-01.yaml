id: 2026-09-23-nfix-full-pipeline-vs-baselines-recovery-01
project: scholarlm
description: >
  Recovery-only comparison of the main pipeline's latest full nfix runs
  (gemma-3-27b, llama-3.1-8b) against the latest full baseline runs
  (langextract, gliner, nuextract3). None of these have judge_combine
  coverage yet, so compute_validity is false. As of 2026-09-24,
  params.ground_truth_file is required and every match_cache.pkl already on
  disk for these ids predates its match_cache.meta.json sidecar, so all of
  them need rebuilding -- run `python analysis/match_cache.py --config
  analysis/analysis-configs/2026-09-23-nfix-full-pipeline-vs-baselines-recovery-01.yaml`
  first. Requires experiments/dataset-configs/nfix.py's DatasetConfig to have
  strict_matching/fuzzy_matching/fuzzy_threshold set (not yet true as of this
  writing -- get_matching_config raises until it is; nfix's ground truth has
  no "ecosystem" column the way pond's fuzzy_matching does, so it needs its
  own rule, not a copy of pond's).
  2026-09-21-nfix-extraction-gptoss120b-full-01 (the only nfix gpt-oss-120b
  full run) and both datasets' baseline_chatextract runs are excluded here:
  their final.json has no point_value/units columns in the current
  strict_matching shape (chatextract emits property/quantity instead; the
  gpt-oss-120b run predates the qualifiers/point_value pipeline schema).
  2026-09-27: experiment_ids' llama8b-reppen extraction/ablation7 entries had
  been copy-pasted from the pond analysis config (pointed at
  2026-09-26-pond-extraction-llama8b-reppen-full-01 and
  2026-09-26-pond-ablation7-llama8b-reppen-full-01, i.e. pond output under an
  nfix config) -- corrected to their real nfix equivalents
  (2026-09-26-nfix-extraction-llama8b-reppen-full-01,
  2026-09-26-nfix-ablation7-llama8b-reppen-full-01), found while drafting
  judge configs off this file's experiment_ids. match_cache.pkl for this
  config needs rebuilding again given the id change.
seed: 342
params:
  ground_truth_file: data/nfix/ground_truth_review.json
  experiment_ids:
    - 2026-09-26-nfix-extraction-llama8b-reppen-full-01
    - 2026-09-21-nfix-extraction-gemma27b-full-01
    - 2026-09-25-nfix-extraction-gptoss120b-full-02
    - 2026-09-29-nfix-ablation1-llama8b-reppen-cap100-noqualifiers-full-01
    - 2026-09-25-nfix-ablation1-gemma27b-noqualifiers-full-01
    - 2026-09-26-nfix-ablation1-gptoss120b-noqualifiers-full-01
    - 2026-09-25-nfix-langextract-gemma27b-noqualifiers-full-01
    - 2026-09-25-nfix-gliner-large-noqualifiers-full-01
    - 2026-09-25-nfix-nuextract3-noqualifiers-full-01
    - 2026-09-26-nfix-chatextract-gemma27b-full-01
    - 2026-09-26-nfix-ablation7-llama8b-reppen-full-01
    - 2026-09-26-nfix-ablation7-gemma27b-full-01
    - 2026-09-26-nfix-ablation7-gptoss120b-full-01
  recovery_validity:
    edge_filter: threshold
    n_resamples: 2000
    alpha: 0.05
    compute_validity: false
    output: analysis/results/2026-09-23-nfix-full-pipeline-vs-baselines-recovery-01.csv
