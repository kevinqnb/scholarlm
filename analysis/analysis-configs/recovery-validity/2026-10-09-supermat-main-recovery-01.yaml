id: 2026-10-09-supermat-main-recovery-01
project: scholarlm
description: >
  supermat: full pipeline (llama-3.1-8b-reppen, gemma-3-27b, gpt-oss-120b) and baselines (GLiNER-large, LangExtract,
  NuExtract3, ChatExtract, ablation 1 per extraction model). One config drives every setup step for its ids, in
  this order: postprocessing -> match_cache -> deduplicate_cache -> deduplication -> recovery_validity (bash analysis/submit.sh
  <script> <id> ...). Dedup fields as in the 2026-10-06 dedup configs: name fuzzy, everything else strict; provenance
  lists merged into each cluster center (postprocessing wraps scalar / absent provenance into lists, so baselines
  and ablations 1/7 dedup too). solver_time_limit_s 600 is per connected component; a component not solved to proven
  optimality in that time is a hard error. Recovery/validity: paper-clustered bootstrap, 2000 resamples, 95% intervals,
  validity from each id's judge_combine; the fuzzy-threshold curve is the gemma-3-27b pipeline only and includes
  supermat's own fuzzy_threshold (0.547).
seed: 0
params:
  ground_truth_file: data/supermat/ground_truth_qualifiers.json
  experiment_ids:
  - 2026-09-26-supermat-extraction-llama8b-reppen-full-01
  - 2026-09-21-supermat-extraction-gemma27b-full-01
  - 2026-09-21-supermat-extraction-gptoss120b-full-01
  - 2026-09-25-supermat-gliner-large-noqualifiers-full-01
  - 2026-09-25-supermat-langextract-gemma27b-noqualifiers-full-01
  - 2026-09-25-supermat-nuextract3-noqualifiers-full-01
  - 2026-09-26-supermat-chatextract-gemma27b-full-01
  - 2026-09-26-supermat-ablation1-llama8b-reppen-noqualifiers-full-01
  - 2026-09-25-supermat-ablation1-gemma27b-noqualifiers-full-01
  - 2026-09-26-supermat-ablation1-gptoss120b-noqualifiers-full-01
  deduplicate_cache:
    extraction_file: postprocessed.json
    strict_fields: [document_id, attribute, point_value, lower, upper, tolerance, standard_deviation, units, qualifiers]
    fuzzy_fields: [name]
    numeric_coerce: [point_value, lower, upper, tolerance, standard_deviation]
    join_list_fields: [qualifiers]
    summary_thresholds: [1.0, 0.9, 0.8]
  deduplication:
    solver_time_limit_s: 600
    provenance_fields: [page_number, table_number, row_index, column_index, source, context]
  recovery_validity:
    n_resamples: 2000
    alpha: 0.05
    compute_validity: true
    output: analysis/results/recovery-validity/2026-10-09-supermat-main-recovery-01.csv
    fuzzy_threshold_curve:
      experiment_ids:
      - 2026-09-21-supermat-extraction-gemma27b-full-01
      thresholds: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.547, 0.55, 0.6, 0.65, 0.7, 0.75,
        0.8, 0.85, 0.9, 0.95, 1.0]
