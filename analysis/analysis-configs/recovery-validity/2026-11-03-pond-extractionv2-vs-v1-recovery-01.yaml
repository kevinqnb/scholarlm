id: 2026-11-03-pond-extractionv2-vs-v1-recovery-01
project: scholarlm
description: 'pond: MeasurementLMv2 vs MeasurementLM (gemma-3-27b, gpt-oss-120b). Every setting copied
  from 2026-10-09-pond-main-recovery-01 so the two v1 rows must reproduce that CSV exactly (known-answer
  check; stop if not). compute_validity=False -- recovery-only gate run before spending the judge jobs.
  (fuzzy_threshold_curve removed 2026-11-04: it plots validity, so recovery_validity.py rejects it when
  compute_validity is false.)'
seed: 0
params:
  deduplicate_cache:
    extraction_file: postprocessed.json
    fuzzy_fields:
    - name
    - date
    join_list_fields:
    - qualifiers
    numeric_coerce:
    - point_value
    - lower
    - upper
    - tolerance
    - standard_deviation
    strict_fields:
    - document_id
    - attribute
    - point_value
    - lower
    - upper
    - tolerance
    - standard_deviation
    - units
    - qualifiers
    summary_thresholds:
    - 1.0
    - 0.9
    - 0.8
  deduplication:
    provenance_fields:
    - page_number
    - table_number
    - row_index
    - column_index
    - source
    - context
    solver_time_limit_s: 600
  experiment_ids:
  - 2026-09-22-pond-extraction-gemma27b-parseqty-standardization-valueonly-01
  - 2026-09-21-pond-extraction-gptoss120b-full-01
  - 2026-11-03-pond-extractionv2-gemma27b-full-01
  - 2026-11-03-pond-extractionv2-gptoss120b-full-01
  ground_truth_file: data/pond/ground_truth_review.json
  recovery_validity:
    alpha: 0.05
    compute_validity: false
    n_resamples: 2000
    output: analysis/results/recovery-validity/2026-11-03-pond-extractionv2-vs-v1-recovery-01.csv
