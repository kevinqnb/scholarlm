id: 2026-11-03-supermat-extractionv2-vs-v1-recovery-validity-01
project: scholarlm
description: 'supermat: MeasurementLMv2 vs MeasurementLM (gemma-3-27b, gpt-oss-120b). Every setting copied
  from 2026-10-09-supermat-main-recovery-01 so the two v1 rows must reproduce that CSV exactly (known-answer
  check; stop if not). compute_validity=True'
seed: 0
params:
  deduplicate_cache:
    extraction_file: postprocessed.json
    fuzzy_fields:
    - name
    join_list_fields:
    - qualifiers
    numeric_coerce:
    - point_value
    - lower
    - upper
    - tolerance
    - standard_deviation
    strict_fields:
    - document_id
    - attribute
    - point_value
    - lower
    - upper
    - tolerance
    - standard_deviation
    - units
    - qualifiers
    summary_thresholds:
    - 1.0
    - 0.9
    - 0.8
  deduplication:
    provenance_fields:
    - page_number
    - table_number
    - row_index
    - column_index
    - source
    - context
    solver_time_limit_s: 600
  experiment_ids:
  - 2026-09-21-supermat-extraction-gemma27b-full-01
  - 2026-09-21-supermat-extraction-gptoss120b-full-01
  - 2026-11-03-supermat-extractionv2-gemma27b-full-01
  - 2026-11-03-supermat-extractionv2-gptoss120b-full-01
  ground_truth_file: data/supermat/ground_truth_qualifiers.json
  recovery_validity:
    alpha: 0.05
    compute_validity: true
    fuzzy_threshold_curve:
      experiment_ids:
      - 2026-09-21-supermat-extraction-gemma27b-full-01
      thresholds:
      - 0.0
      - 0.05
      - 0.1
      - 0.15
      - 0.2
      - 0.25
      - 0.3
      - 0.35
      - 0.4
      - 0.45
      - 0.5
      - 0.547
      - 0.55
      - 0.6
      - 0.65
      - 0.7
      - 0.75
      - 0.8
      - 0.85
      - 0.9
      - 0.95
      - 1.0
    n_resamples: 2000
    output: analysis/results/recovery-validity/2026-11-03-supermat-extractionv2-vs-v1-recovery-validity-01.csv
