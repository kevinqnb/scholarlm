id: 2026-10-09-ablations-recovery-validity-latex-01
project: scholarlm
description: >
  LaTeX table of recovery / validity with 95% paper-clustered bootstrap intervals for the full pipeline and ablations 1-5, one
  column per dataset (pond, nfix). Ablations 2-5 come from the 2026-10-09-<dataset>-ablations-recovery-01 CSVs; the pipeline and
  ablation 1 rows from the 2026-10-09-<dataset>-main-recovery-01 CSVs (same ground truth, checked). Ablation 7 is not shown
  (its rows remain in the ablations CSVs). Formatting only; seed unused.
seed: 0
params:
  recovery_validity_latex:
    datasets:
      PLW:
        dataset: pond
        analysis_config: [2026-10-09-pond-ablations-recovery-01, 2026-10-09-pond-main-recovery-01]
      NF:
        dataset: nfix
        analysis_config: [2026-10-09-nfix-ablations-recovery-01, 2026-10-09-nfix-main-recovery-01]
    decimals: 1
    ci_format: pm
    output: analysis/results/recovery-validity/2026-10-09-ablations-recovery-validity.tex
    caption: '(Recovery, validity) in \% with 95\% paper-clustered bootstrap intervals ($\pm$ half-width) for the full pipeline
      and ablations 1--5. PLW, NF: pond, nfix.'
    label: tab:ablations-recovery-validity
    figure:
      output_dir: analysis/results/recovery-validity/2026-10-09-ablations-recovery-validity-figures
      group_font: mono
      label_font: serif
