id: 2026-10-07-calibration-v3-gemma27b-qwen-2.5-7b-intercept-fit-nested-tiny-01
project: scholarlm
description: >
  Rung-3 tiny end-to-end for the nested-bootstrap CIs: same inputs as
  2026-10-07-calibration-v3-gemma27b-qwen-2.5-7b-intercept-fit-01, with 10 recalibration fit samples x 10 test-document
  resamples (real) and 100 document resamples (synthetic). Fit samples: PLATT_N rows drawn uniformly
  from a document-resampled Platt pool. Predictions made in advance: (a) fit-sample label rates average
  near the simulated targets (pond ~0.44, nfix ~0.27, supermat ~0.34, +-0.05); (b) the refitting share
  of the smECE spread grows over the document-balanced design's (0.012-0.021 median SD); (c) smECE
  points rise in the pond and supermat test columns; (d) a second run with the same seed is identical.
  Run: uv run python analysis/calibration_updated_v3.py analysis/analysis-configs/2026-10-07-calibration-v3-gemma27b-qwen-2.5-7b-intercept-fit-nested-tiny-01.yaml
