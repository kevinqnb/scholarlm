id: 2026-10-07-calibration-v3-gemma27b-qwen-2.5-7b-prior-shift-01
project: scholarlm
description: >
  Calibration analysis v3 (analysis/calibration_updated_v3.py), recalibration: prior_shift.
  Same probe / NTP calibrator / extractions / judge runs / platt_n as
  2026-10-04-calibration-v3-gemma27b-qwen-2.5-7b-v3-01; only the recalibration method
  and the code version differ. Prior-shift (label-shift) correction: logit p + logit(sample label rate) -
  logit(pi_tr), pi_tr the scorer's synthetic training prevalence; nothing fitted to
  the sample's probabilities (calibration_updated.py's intercept_adjustment with
  pi_te estimated from the platt_n-row sample instead of hand-set).
  Compare against 2026-10-07-calibration-v3-gemma27b-qwen-2.5-7b-platt-fit-01.
  Real test rows exclude the Platt pool; synthetic test cells are not recalibrated.
  Known caveat: the supermat qualifier-pipeline run has ~43% unmatchable `value`,
  which depresses the matching-derived labels for supermat.
  Run: bash analysis/submit.sh calibration_v3 2026-10-07-calibration-v3-gemma27b-qwen-2.5-7b-prior-shift-01 --walltime 01:00:00 --omp 4
