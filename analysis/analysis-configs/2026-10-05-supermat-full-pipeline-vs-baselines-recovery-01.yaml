id: 2026-10-05-supermat-full-pipeline-vs-baselines-recovery-01
project: scholarlm
description: >
  Same experiment ids, ground truth and seed as
  2026-09-23-supermat-full-pipeline-vs-baselines-recovery-01, but recovery 
  is a max-weight-matching count. Needs
  the same rebuilt match caches as the threshold config. Split rows in
  postprocessed.json inherit their parent measurement's judgement. Dropped from
  the id list because they have no usable judge_combine output yet (add them back
  once it exists):
  - 2026-09-26-supermat-extraction-llama8b-reppen-full-01: none of its six judge runs have results, so no combined.json.
seed: 342
params:
  ground_truth_file: data/supermat/ground_truth_qualifiers.json
  experiment_ids:
    - 2026-09-21-supermat-extraction-gemma27b-full-01
    - 2026-09-21-supermat-extraction-gptoss120b-full-01
    - 2026-09-26-supermat-ablation1-llama8b-reppen-noqualifiers-full-01
    - 2026-09-25-supermat-ablation1-gemma27b-noqualifiers-full-01
    - 2026-09-26-supermat-ablation1-gptoss120b-noqualifiers-full-01
    - 2026-09-25-supermat-langextract-gemma27b-noqualifiers-full-01
    - 2026-09-25-supermat-gliner-large-noqualifiers-full-01
    - 2026-09-25-supermat-nuextract3-noqualifiers-full-01
    - 2026-09-26-supermat-chatextract-gemma27b-full-01
  recovery_validity:
    edge_filter: threshold
    n_resamples: 2000
    alpha: 0.05
    compute_validity: true
    output: analysis/results/recovery-validity/2026-10-05-supermat-full-pipeline-vs-baselines-recovery-01.csv
