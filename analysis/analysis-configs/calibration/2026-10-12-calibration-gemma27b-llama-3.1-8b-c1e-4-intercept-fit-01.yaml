id: 2026-10-12-calibration-gemma27b-llama-3.1-8b-c1e-4-intercept-fit-01
project: scholarlm
description: >
  Calibration (analysis/calibration.py, v4) of the llama-3.1-8b head probe and NTP on the gemma27b full-pipeline
  extractions of pond, nfix and supermat (supermat probe on the v3s split), every train x test dataset cell plus
  the synthetic test sets (primary split). Real cells: one intercept_fit map (slope 1, intercept by MLE) fit once
  on fit_n=50 rows drawn by fit_seed=0 from the test dataset's probe-training pool; labels are judge_combine OR
  ground-truth match. Intervals: 2000 test-document bootstrap resamples. Same as 2026-10-10-calibration-gemma27b-llama-3.1-8b-intercept-fit-01 except the head probes are the 2026-10-12 C=1e-4 synthetic probes (head_selection_C = probe_C = 1.0e-4).
