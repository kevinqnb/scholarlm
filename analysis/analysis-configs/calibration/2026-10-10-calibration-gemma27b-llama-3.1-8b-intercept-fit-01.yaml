      synthetic_probe_config: 2026-10-10-pond-synthetic-probe-llama-3.1-8b-01
      use_matching_labels: true
      pi_te_estimate: null
      syn_test_ids: {primary: 2026-09-30-pond-v3-llama-3.1-8b-synthetic-judge-test-primary-01, diag: 2026-09-30-pond-v3-llama-3.1-8b-synthetic-judge-test-diag-01}
