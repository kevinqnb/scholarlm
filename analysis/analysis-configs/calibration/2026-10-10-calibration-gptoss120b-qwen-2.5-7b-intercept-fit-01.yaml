id: 2026-10-10-calibration-gptoss120b-qwen-2.5-7b-intercept-fit-01
project: scholarlm
description: >
  Calibration (analysis/calibration.py, v4) of the qwen-2.5-7b head probe and NTP on the gpt-oss-120b full-pipeline
  extractions of pond, nfix and supermat (supermat probe on the v3s split), every train x test dataset cell plus
  the synthetic test sets (primary split). Real cells: one intercept_fit map (slope 1, intercept by MLE) fit once
  on fit_n=100 rows drawn by fit_seed=0 from the test dataset's probe-training pool; labels are judge_combine OR
  ground-truth match. Intervals: 2000 test-document bootstrap resamples. Re-run of 2026-10-09-calibration-gptoss120b-qwen-2.5-7b-intercept-fit-01: NTP is the judge's raw p(true), recalibrated only here (no synthetic-trained calibrator, commit cc3036f); Platt-family logit clip 1e-10 (commit b8b5949); head probes from the 2026-10-10 synthetic-probe re-runs.
seed: 0
params:
  probe_type: head
  probe_variant: platt
  syn_split: primary
  n_boot: 2000
  recalibration: intercept_fit
  fit_source: sample
  fit_n: 100
  fit_seed: 0
  datasets:
    pond:
      extraction_id: 2026-09-21-pond-extraction-gptoss120b-full-01
      judge_interp_id: 2026-09-27-pond-extraction-gptoss120b-qwen7b-judge-interp-01
      judge_combine_id: 2026-09-27-pond-extraction-gptoss120b-judge-combine-01
