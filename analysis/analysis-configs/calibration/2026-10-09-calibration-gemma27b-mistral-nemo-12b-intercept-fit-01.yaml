      use_matching_labels: true
      pi_te_estimate: null
      syn_test_ids:
        primary: 2026-09-30-pond-v3-mistral-nemo-12b-synthetic-judge-test-primary-01
        diag: 2026-09-30-pond-v3-mistral-nemo-12b-synthetic-judge-test-diag-01
