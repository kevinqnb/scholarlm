id: 2026-10-05-nfix-full-pipeline-vs-baselines-recovery-01
project: scholarlm
description: >
  Same experiment ids, ground truth and seed as
  2026-09-23-nfix-full-pipeline-vs-baselines-recovery-01, with validity on. Created 2026-10-05 when
  recovery was a max-weight-matching count; since 2026-10-07 recovery is the any-edge
  count and the matching count is the separate recovery_max_weight_matching column.
  Dropped from the id list because they have no usable judge_combine output yet (add them back
  once it exists):
  - 2026-09-26-nfix-extraction-llama8b-reppen-full-01: none of its six judge runs have results, so no combined.json.
  - 2026-09-29-nfix-ablation1-llama8b-reppen-cap100-noqualifiers-full-01: its three voting judge runs finished but run_judge_combine has not been run, so no combined.json.
seed: 342
params:
  ground_truth_file: data/nfix/ground_truth_review.json
  experiment_ids:
    - 2026-09-26-nfix-extraction-llama8b-reppen-full-01
    - 2026-09-21-nfix-extraction-gemma27b-full-01
    - 2026-09-25-nfix-extraction-gptoss120b-full-02
    - 2026-09-29-nfix-ablation1-llama8b-reppen-cap100-noqualifiers-full-01
    - 2026-09-25-nfix-ablation1-gemma27b-noqualifiers-full-01
    - 2026-09-26-nfix-ablation1-gptoss120b-noqualifiers-full-01
    - 2026-09-25-nfix-langextract-gemma27b-noqualifiers-full-01
    - 2026-09-25-nfix-gliner-large-noqualifiers-full-01
    - 2026-09-25-nfix-nuextract3-noqualifiers-full-01
    - 2026-09-26-nfix-chatextract-gemma27b-full-01
  recovery_validity:
    n_resamples: 2000
    alpha: 0.05
    compute_validity: true
    output: analysis/results/recovery-validity/2026-10-05-nfix-full-pipeline-vs-baselines-recovery-01.csv
    # Recovery/validity swept over the fuzzy threshold (full-pipeline gemma-3-27b only);
    # must include nfix's own fuzzy_threshold (0.532). Figures -> analysis/results/recovery-validity/<id>/figures/.
    fuzzy_threshold_curve:
      experiment_ids:
        - 2026-09-21-nfix-extraction-gemma27b-full-01
      thresholds: [0.00, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.532, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00]
