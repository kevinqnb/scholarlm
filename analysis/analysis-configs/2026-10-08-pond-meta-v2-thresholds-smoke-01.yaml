id: 2026-10-08-pond-meta-v2-thresholds-smoke-01
project: scholarlm
description: >
  SMOKE (n_boot=20). meta_updated_v2.py (hard confidence thresholds, unweighted np.quantile Q-Q
  lines, scipy W1 with percentile bootstrap CIs) on the same inputs and cells as
  2026-10-07-pond-meta-dedup-pondlake-01: deduplicated rows from
  2026-10-06-pond-deduplication-01, cluster-center confidence. Unlike that run, the
  pond->pond real-cell probe / NTP confidences are the v4 intercept-fit recalibrated
  predictions of 2026-10-08-calibration-v4-gemma27b-qwen-2.5-7b-intercept-fit-sample-01
  (the 2026-10-04 v3 config no longer validates under the current v3 loader). Cells:
  pond and lake x surface_area, max_depth, ph, chla. Threshold t keeps rows with
  confidence >= t, t = 0.00..0.95 step 0.05; a Q-Q line / W1 needs >= 5 rows. Unlike v1,
  GT and extracted rows are NOT restricted to shared documents -- each side only drops
  the probe/NTP training documents.
  n_shuffle_samples (20) added 2026-10-08 when the shuffle control became an
  average over permutations (commit 94d91f6); earlier outputs used one permutation.
  Run: python analysis/meta_updated_v2.py analysis/analysis-configs/2026-10-08-pond-meta-v2-thresholds-smoke-01.yaml
seed: 0
params:
  meta_v2:
    calibration_config_id: 2026-10-08-calibration-v4-gemma27b-qwen-2.5-7b-intercept-fit-sample-01
    calibration_version: v4
    rows: deduplicated
    deduplication_config_id: 2026-10-06-pond-deduplication-01
    confidence: center
    n_boot: 20
    reference: ground_truth
    ecosystems: [pond, lake]
    attributes: [surface_area, max_depth, ph, chla]
    qq_attributes: [surface_area, max_depth, ph, chla]
    thresholds: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95]
    min_n: 5
    n_shuffle_samples: 20
    outlier_adjust: false
    threshold_mode: value
