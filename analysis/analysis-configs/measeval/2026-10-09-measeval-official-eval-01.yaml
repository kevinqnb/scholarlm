id: 2026-10-09-measeval-official-eval-01
project: scholarlm
description: >
  Official MeasEval (SemEval-2021 Task 8) scorer on the eval split for the full pipeline (llama-3.1-8b-reppen, gemma-3-27b,
  gpt-oss-120b) and the baselines (GLiNER-large, LangExtract, NuExtract3, ChatExtract, ablation 1 per extraction
  model); ablation 7 dropped. dev: false filters each run to its eval-split documents before scoring. ground_truth_file
  is the official eval gold directory (required by the shared loader; measeval_evaluation.py scores against that
  same directory internally). Reads final.json directly, so no setup step applies. seed unused (no resampling).
seed: 0
params:
  ground_truth_file: data/measeval/raw/data/eval/tsv
  experiment_ids:
  - 2026-09-26-measeval-extraction-llama8b-reppen-full-01
  - 2026-09-21-measeval-extraction-gemma27b-full-01
  - 2026-09-21-measeval-extraction-gptoss120b-full-01
  - 2026-09-25-measeval-gliner-large-noqualifiers-full-01
  - 2026-09-25-measeval-langextract-gemma27b-noqualifiers-full-01
  - 2026-09-25-measeval-nuextract3-noqualifiers-full-01
  - 2026-09-26-measeval-chatextract-gemma27b-full-01
  - 2026-09-26-measeval-ablation1-llama8b-reppen-noqualifiers-full-01
  - 2026-09-25-measeval-ablation1-gemma27b-noqualifiers-full-01
  - 2026-09-26-measeval-ablation1-gptoss120b-noqualifiers-full-01
  measeval_evaluation:
    dev: false
    output: analysis/results/measeval/2026-10-09-measeval-official-eval-01.csv
