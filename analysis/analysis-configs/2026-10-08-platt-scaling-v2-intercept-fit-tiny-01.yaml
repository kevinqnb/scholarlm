id: 2026-10-08-platt-scaling-v2-intercept-fit-tiny-01
project: scholarlm
description: >
  Rung-3 tiny end-to-end for the training-resample Platt-n sweep (analysis/platt_scaling_v2.py,
  fit samples from doc_bootstrap.two_class_fit_samples): same inputs, seed, platt_ns and
  recalibration (intercept_fit) as 2026-10-08-platt-scaling-sweep-gemma27b-qwen-2.5-7b-intercept-fit-nested-01,
  100 train resamples. Known answers: Pool N, Test N, Test docs and Test label rate equal that run's
  in all 108 (train, test, method, n) cells. Predicted: the fit samples are drawn from the same
  distribution as that run's (different RNG streams), so each cell's mean SmECE agrees with its
  point within 3 Monte Carlo standard errors (sd of each run's 100 values / 10, combined) in all
  but at most a couple of the 108 cells; the 95% band narrows from n=10 to n=1000 in every cell.
seed: 0
params:
  probe_type: head
  probe_variant: platt
  syn_split: primary
  platt_ns: [10, 50, 100, 250, 500, 1000]
  recalibration: intercept_fit
  n_train_resamples: 100
  datasets:
    pond:
      extraction_id: 2026-09-22-pond-extraction-gemma27b-parseqty-standardization-valueonly-01
      judge_interp_id: 2026-09-27-pond-extraction-gemma27b-parseqty-standardization-valueonly-qwen7b-judge-interp-01
