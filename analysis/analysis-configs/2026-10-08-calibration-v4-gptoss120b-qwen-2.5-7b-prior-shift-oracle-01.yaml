id: 2026-10-08-calibration-v4-gptoss120b-qwen-2.5-7b-prior-shift-oracle-01
project: scholarlm
description: >
  Calibration analysis v4 with prior-shift recalibration and an ORACLE prior -- pi_te is each
  test dataset's own evaluated-row label rate -- for the qwen-2.5-7b interp judge over the
  gptoss120b full-pipeline extractions. Diagnostic only (prior shift under a perfect
  prevalence estimate), not a reportable number. Same inputs, test rows and 2000
  test-document resamples (seed 0) as
  2026-10-08-calibration-v4-gptoss120b-qwen-2.5-7b-intercept-fit-sample-01; mirrors
  2026-10-08-calibration-v4-gemma27b-qwen-2.5-7b-oracle-01 for the gemma27b extractions.
  Run: bash analysis/submit.sh calibration_v4 2026-10-08-calibration-v4-gptoss120b-qwen-2.5-7b-prior-shift-oracle-01 --walltime 04:00:00 --omp 4
  Supermat uses the v3 (pre-v3s) synthetic probe/test ids -- supermat numbers are invalid
  until switched to the v3s supermat probe.
seed: 0
params:
  probe_type: head
  probe_variant: platt
  syn_split: primary
  n_boot: 2000
  recalibration: prior_shift
  fit_source: oracle
  fit_n: null
  fit_seed: null
