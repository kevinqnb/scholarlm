id: 2026-10-08-calibration-validated-gemma27b-qwen-2.5-7b-nested-01
project: scholarlm
description: >
  Calibration analysis scored on human validations (analysis/calibration_validated.py),
  recalibration: platt_fit. Same inputs and pinned validations as 2026-10-06-calibration-validated-gemma27b-qwen-2.5-7b-v3-01.
  Real test cells are scored only on human-labelled test rows; recalibration samples
  stay labelled by LLM + matching (the training split has no human labels).
  Nested-bootstrap CIs (analysis/nested_bootstrap.py, commit 42b6952): real cells cross
  100 recalibration fit samples (platt_n rows drawn uniformly from a document-resampled Platt
  pool) with 100 test-document cluster resamples; synthetic cells (not recalibrated) get 2000
  document resamples. Point = un-resampled value averaged over fit samples; interval = 95%
  percentile range over all replicates.
  Supersedes that run's intervals, bands and point estimates (eval change).
  Run: bash analysis/submit.sh calibration_validated 2026-10-08-calibration-validated-gemma27b-qwen-2.5-7b-nested-01 --walltime 01:30:00 --omp 4
