id: 2026-10-08-calibration-v4-gemma27b-qwen-2.5-7b-intercept-fit-sample-platt-01
project: scholarlm
description: >
  Train-side Platt vs no-Platt comparison under calibration v4, platt side. v4's intercept_fit
  recalibration fixes the slope at 1 (v3 re-fit slope + intercept, which made train-side Platt
  redundant), so the probe's own slope now survives into the scored probabilities.
  Same inputs and params as 2026-10-08-calibration-v4-gemma27b-qwen-2.5-7b-intercept-fit-sample-01.
  Byte-identical params to the reference, so it doubles as a seed-determinism control:
  every output must equal the reference run's exactly.
  Run: bash analysis/submit.sh calibration_v4 2026-10-08-calibration-v4-gemma27b-qwen-2.5-7b-intercept-fit-sample-platt-01 --walltime 04:00:00 --omp 4
  Supermat uses the v3 (pre-v3s) synthetic probe/test ids, like the reference -- supermat
  numbers are invalid until switched to the v3s supermat probe.
seed: 0
params:
  probe_type: head
  probe_variant: platt
  syn_split: primary
  n_boot: 2000
  recalibration: intercept_fit
  fit_source: sample
  fit_n: 100
  fit_seed: 0
  datasets:
    pond:
      extraction_id: 2026-09-22-pond-extraction-gemma27b-parseqty-standardization-valueonly-01
      judge_interp_id: 2026-09-27-pond-extraction-gemma27b-parseqty-standardization-valueonly-qwen7b-judge-interp-01
      judge_combine_id: 2026-09-27-pond-extraction-gemma27b-parseqty-standardization-valueonly-judge-combine-01
