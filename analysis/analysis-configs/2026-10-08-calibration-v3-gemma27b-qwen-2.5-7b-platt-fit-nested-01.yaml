project: scholarlm
description: >
  Calibration analysis v3 (analysis/calibration_updated_v3.py), recalibration: platt_fit.
  Same inputs as 2026-10-07-calibration-v3-gemma27b-qwen-2.5-7b-platt-fit-01.
  Nested-bootstrap CIs (analysis/nested_bootstrap.py, commit 42b6952): real cells cross
  100 recalibration fit samples (platt_n rows drawn uniformly from a document-resampled Platt
  pool) with 100 test-document cluster resamples; synthetic cells (not recalibrated) get 2000
  document resamples. Point = un-resampled value averaged over fit samples; interval = 95%
  percentile range over all replicates.
  Supersedes that run's intervals, bands and point estimates (eval change).
  Known caveat: the supermat qualifier-pipeline run has ~43% unmatchable `value`,
  which depresses the matching-derived labels for supermat.
  Run: bash analysis/submit.sh calibration_v3 2026-10-08-calibration-v3-gemma27b-qwen-2.5-7b-platt-fit-nested-01 --walltime 06:00:00 --omp 4
