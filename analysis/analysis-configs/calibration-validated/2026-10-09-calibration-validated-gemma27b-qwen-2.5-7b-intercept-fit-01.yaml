  the gemma27b pond and supermat extractions (supermat probe on the v3s split, matching the validation sets' split).
  recalibration intercept_fit on platt_n=100 rows from the test dataset's probe-training pool, labelled by LLM +
  matching (the training split has no human labels); real test cells scored only on human-labelled rows. Written
  in the script's current v3 schema: nested bootstrap of n_fit_samples=100 recalibration fit samples x n_doc_boot=100
  test-document resamples (10000 replicates), n_syn_boot=2000 for synthetic cells. NOT RUN NOW: the script is to
  be ported to calibration.py's v4 machinery (one fit, n_boot), which will re-key this config. Validation files
  pinned by sha256.
