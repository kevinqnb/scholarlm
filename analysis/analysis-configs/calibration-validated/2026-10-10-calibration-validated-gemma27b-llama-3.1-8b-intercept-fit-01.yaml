id: 2026-10-10-calibration-validated-gemma27b-llama-3.1-8b-intercept-fit-01
project: scholarlm
description: >
  Calibration scored on human validations (analysis/calibration_validated.py, v4) for the llama-3.1-8b probe / NTP on
  the gemma27b pond and supermat extractions (supermat probe on the v3s split, matching the validation sets' split).
  Same recalibration as the sibling calibration.py config: one intercept_fit map fit once on fit_n=100 rows drawn by
  fit_seed=0 from the test dataset's probe-training pool, labelled by LLM + matching (the training split has no human
  labels). Real test cells are scored only on the human-validated rows, all of which must lie outside the probe-training
  documents (asserted). Intervals: 2000 test-document bootstrap resamples. Validation files pinned by sha256.
  llama-3.1-8b counterpart of 2026-10-09-calibration-validated-gemma27b-qwen-2.5-7b-intercept-fit-01 (judge fields from 2026-10-09-calibration-gemma27b-llama-3.1-8b-intercept-fit-01): NTP is the judge's raw p(true), recalibrated only here (no synthetic-trained calibrator, commit cc3036f); Platt-family logit clip 1e-10 (commit b8b5949); head probes from the 2026-10-10 synthetic-probe re-runs.
