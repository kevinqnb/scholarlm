id: 2026-10-10-decision-threshold-gemma27b-llama-3.1-8b-01
project: scholarlm
description: >
  Recovery / validity vs decision threshold (keep rows with p >= t) on the intercept_fit-recalibrated llama-3.1-8b
  probe and NTP probabilities of 2026-10-10-calibration-gemma27b-llama-3.1-8b-intercept-fit-01, within-dataset cells
  only. Scored on the test documents only (fit-pool and probe-training documents have no predictions), so t = 0
  is recovery_validity's score on those documents, not the all-document number. Permutation control: mean curve
  over 2000 shuffles of the probabilities.
  Derived from 2026-10-09-decision-threshold-gemma27b-llama-3.1-8b-01; same settings. Re-run on the 2026-10-10 calibration (NTP = the judge's raw p(true) recalibrated by intercept_fit, no synthetic-trained calibrator, commit cc3036f; logit clip 1e-10, commit b8b5949; 2026-10-10 re-trained head probes).
