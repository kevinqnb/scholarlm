id: 2026-10-09-supermat-synthetic-probe-qwen-2.5-7b-01
project: scholarlm
description: >
  Head probe + NTP calibrator for qwen-2.5-7b on the supermat v3s (v3 realigned to the v1/v2 paper split, so the
  validation-set papers are held out) synthetic corpus, from judge_interp run 2026-10-08-supermat-v3s-qwen-2.5-7b-synthetic-judge-train-01.
  use_platt_scaling: true wraps both the head probe and the NTP calibrator in CalibratedClassifierCV (sigmoid, k-fold);
  calibration configs must use probe_variant: platt. The probe's syn_document_ids define the real-data train/test
  split every calibration-family analysis uses.
seed: 0
params:
  dataset: supermat
  judge_interp_id: 2026-10-08-supermat-v3s-qwen-2.5-7b-synthetic-judge-train-01
  use_platt_scaling: true
