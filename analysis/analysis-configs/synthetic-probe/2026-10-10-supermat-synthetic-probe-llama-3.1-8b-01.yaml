id: 2026-10-10-supermat-synthetic-probe-llama-3.1-8b-01
project: scholarlm
description: >
  Head probe for llama-3.1-8b on the supermat v3s (v3 realigned to the v1/v2 paper split, so the validation-set papers are held out) synthetic corpus, from judge_interp run 2026-10-08-supermat-v3s-llama-3.1-8b-synthetic-judge-train-01.
  Re-run of 2026-10-09-supermat-synthetic-probe-llama-3.1-8b-01 after commit cc3036f, which removed the synthetic-trained NTP calibrator (NTP is now
  the judge's raw p(true)); same params and seed, so the head probe should be identical to 2026-10-09-supermat-synthetic-probe-llama-3.1-8b-01's.
  use_platt_scaling: true wraps the head probe in CalibratedClassifierCV (sigmoid, k-fold); calibration configs
  must use probe_variant: platt. The probe's syn_document_ids define the real-data train/test split every
  calibration-family analysis uses.
seed: 0
params:
  dataset: supermat
  judge_interp_id: 2026-10-08-supermat-v3s-llama-3.1-8b-synthetic-judge-train-01
  use_platt_scaling: true
  exclude_documents: []
