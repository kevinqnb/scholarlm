id: 2026-10-06-pond-deduplicate-cache-01
project: scholarlm
description: >
  Within-extraction duplicate graph (all strict-equal row pairs with their
  mean fuzzy score, cached at threshold 0.0) for the pond full-pipeline
  extraction, so deduplication techniques (greedy vs connected components vs
  complete linkage) can be compared on the cached edges without rescoring.
  Field choice follows the 2026-09-23-extraction-dedup-01 session: name/date
  fuzzy; document, attribute, units, the parsed-quantity fields and qualifiers
  strict. Add further extraction ids to experiment_ids as needed -- they must
  share these columns (the postprocessed full-pipeline schema), so baselines
  with a different schema need their own config. seed is required by the
  analysis-config envelope and unused (the build is deterministic).
seed: 342
params:
  experiment_ids:
    - 2026-09-22-pond-extraction-gemma27b-parseqty-standardization-valueonly-01
  deduplicate_cache:
    extraction_file: postprocessed.json
    strict_fields: [document_id, attribute, point_value, lower, upper, tolerance, standard_deviation, units, qualifiers]
    fuzzy_fields: [name, date]
    numeric_coerce: [point_value, lower, upper, tolerance, standard_deviation]
    join_list_fields: [qualifiers]
    summary_thresholds: [1.0, 0.9, 0.8]
