id: 2026-10-06-supermat-deduplicate-cache-01
project: scholarlm
description: >
  Within-extraction duplicate graph (all strict-equal row pairs with their
  mean fuzzy score, cached at threshold 0.0) for the supermat gemma27b full
  extraction. Same strict fields as 2026-10-06-pond-deduplicate-cache-01.
  supermat has no date column, so name is the only fuzzy field (as in its matcher). Its formula-notation normalizer (canonical_formula_name) is not applied -- deduplicate_cache does not support fuzzy_normalizers.
  seed is required by the analysis-config envelope and unused.
seed: 342
params:
  experiment_ids:
    - 2026-09-21-supermat-extraction-gemma27b-full-01
  deduplicate_cache:
    extraction_file: postprocessed.json
    strict_fields: [document_id, attribute, point_value, lower, upper, tolerance, standard_deviation, units, qualifiers]
    fuzzy_fields: [name]
    numeric_coerce: [point_value, lower, upper, tolerance, standard_deviation]
    join_list_fields: [qualifiers]
    summary_thresholds: [1.0, 0.9, 0.8]
