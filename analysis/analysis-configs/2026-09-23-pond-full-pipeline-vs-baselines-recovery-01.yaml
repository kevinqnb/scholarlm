id: 2026-09-23-pond-full-pipeline-vs-baselines-recovery-01
project: scholarlm
description: >
  Recovery-only comparison of the main pipeline's latest full pond runs
  (gemma-3-27b, gpt-oss-120b, llama-3.1-8b) against the latest full baseline
  runs (langextract, gliner, nuextract3). None of these have judge_combine
  coverage yet, so compute_validity is false. As of 2026-09-24,
  params.ground_truth_file is required and every match_cache.pkl on disk
  (including nuextract3's) predates its match_cache.meta.json sidecar, so all
  of them -- not just nuextract3 -- need rebuilding: run
  `python analysis/match_cache.py --config
  analysis/analysis-configs/2026-09-23-pond-full-pipeline-vs-baselines-recovery-01.yaml`
  first to build/rebuild every id (~15min/id, uncached).
seed: 342
params:
  ground_truth_file: data/pond/ground_truth_review.json
  experiment_ids:
    - 2026-09-26-pond-extraction-llama8b-reppen-full-01
    - 2026-09-22-pond-extraction-gemma27b-parseqty-standardization-valueonly-01
    - 2026-09-21-pond-extraction-gptoss120b-full-01
    #- 2026-09-26-pond-ablation1-llama8b-reppen-noqualifiers-full-01
    - 2026-09-25-pond-ablation1-gemma27b-noqualifiers-full-01
    - 2026-09-26-pond-ablation1-gptoss120b-noqualifiers-full-01
    - 2026-09-25-pond-langextract-gemma27b-noqualifiers-full-01
    - 2026-09-25-pond-gliner-large-noqualifiers-full-01
    - 2026-09-25-pond-nuextract3-noqualifiers-full-01
    - 2026-09-26-pond-chatextract-gemma27b-full-01
    - 2026-09-26-pond-ablation7-llama8b-reppen-full-01
    - 2026-09-26-pond-ablation7-gemma27b-full-01
    - 2026-09-26-pond-ablation7-gptoss120b-full-01
  recovery_validity:
    n_resamples: 2000
    alpha: 0.05
    compute_validity: false
    output: analysis/results/2026-09-23-pond-full-pipeline-vs-baselines-recovery-01.csv
