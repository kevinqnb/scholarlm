id: 2026-10-10-pond-meta-gemma27b-qwen-2.5-7b-03
project: scholarlm
description: >
  Pond meta-analysis (analysis/pond_meta_analysis.py), qwen-2.5-7b probe and NTP, without the confidence x outlier-factor
  product: probe and NTP thresholds use the stored confidences, and a separate z-score source thresholds the robust
  non-outlier score exp(-z^2/2), z = (x - median) / (1.4826 MAD) per (ecosystem, attribute). Deduplicated gemma27b rows
  (deduplication of 2026-10-09-pond-main-recovery-01, cluster-center confidence), pond->pond intercept_fit
  confidences of 2026-10-10-calibration-gemma27b-qwen-2.5-7b-intercept-fit-01. Percentile thresholding: W1 curves and tables at t = 0, 0.01, ..., 0.99; Q-Q lines at
  t = 0, 0.1, ..., 0.9; a Q-Q line / W1 needs >= 5 rows. W1-vs-threshold curves (probe, NTP, z-score) plot
  unnormalized W1 on each attribute's native scale (log10 values for surface_area and max_depth, raw for pH), against
  a random-subset baseline and the valid extracted rows' W1. W1 intervals: 2000 bootstrap resamples; random baseline:
  2000 draws. Derived from 2026-10-10-pond-meta-gemma27b-qwen-2.5-7b-02; same inputs.
