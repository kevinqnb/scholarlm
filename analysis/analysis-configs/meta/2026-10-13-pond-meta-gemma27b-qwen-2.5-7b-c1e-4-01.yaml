id: 2026-10-13-pond-meta-gemma27b-qwen-2.5-7b-c1e-4-01
project: scholarlm
description: >
  Pond meta-analysis (analysis/pond_meta_analysis.py), qwen-2.5-7b head probe (C=1e-4) and NTP, with soft-weighted W1 curves
  (w1_mode: weight, every extracted row weighted by its score ** gamma, gamma = 0..5 in 101 steps, a point needs Kish
  n_eff >= min_n; random baseline weights rows by U(0, 1) ** gamma; unsmoothed). Probe and NTP use the stored confidences
  and a separate z-score source uses the robust non-outlier score exp(-z^2/2), z = (x - median) / (1.4826 MAD) per
  (ecosystem, attribute). Deduplicated gemma27b rows (deduplication of 2026-10-09-pond-main-recovery-01, cluster-center
  confidence), pond->pond intercept_fit probe confidences of 2026-10-12-calibration-gemma27b-qwen-2.5-7b-c1e-4-intercept-fit-01; NTP is the judge's raw p(true),
  never recalibrated (commit 7c182ac). Percentile Q-Q lines at t = 0, 0.1, ..., 0.9; a Q-Q line / W1 needs >= 5 rows.
  W1 on each attribute's native scale (log10 values for surface_area and max_depth, raw for pH). W1 intervals: 2000
  bootstrap resamples; random baseline: 2000 draws. c1e-4 counterpart of 2026-10-10-pond-meta-gemma27b-qwen-2.5-7b-07.
seed: 0
