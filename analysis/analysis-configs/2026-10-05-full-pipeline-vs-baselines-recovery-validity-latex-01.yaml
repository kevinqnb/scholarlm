id: 2026-10-05-full-pipeline-vs-baselines-recovery-validity-latex-01
project: scholarlm
description: >
  LaTeX table of recovery / validity (+ paper-clustered bootstrap interval) for the
  full pipeline vs baselines, one column per dataset, read from the three
  2026-10-05-*-full-pipeline-vs-baselines-recovery-01 result CSVs. Formatting only;
  seed is required by the analysis-config envelope and is unused here.
  Not included (no row requested): the ablation7 runs, and the llama8b full-extraction
  runs (no judge_combine output for nfix/supermat yet; no pond run).
seed: 342
params:
  recovery_validity_latex:
    datasets:
      PLW: {dataset: pond, analysis_config: 2026-10-05-pond-full-pipeline-vs-baselines-recovery-01}
      NF: {dataset: nfix, analysis_config: 2026-10-05-nfix-full-pipeline-vs-baselines-recovery-01}
      SM: {dataset: supermat, analysis_config: 2026-10-05-supermat-full-pipeline-vs-baselines-recovery-01}
    decimals: 1
    ci_format: pm
    output: analysis/results/recovery-validity/2026-10-05-full-pipeline-vs-baselines-recovery-validity.tex
    caption: >-
      (Recovery, validity) in \% with 95\% paper-clustered bootstrap intervals
      ($\pm$ half-width). PLW, NF, SM: pond, nfix, supermat.
    label: tab:recovery-validity
    blocks:
      - rows:
          - label: GLiNER-large
            ids:
              PLW: 2026-09-25-pond-gliner-large-noqualifiers-full-01
              NF: 2026-09-25-nfix-gliner-large-noqualifiers-full-01
              SM: 2026-09-25-supermat-gliner-large-noqualifiers-full-01
          - label: LangExtract
            ids:
              PLW: 2026-09-25-pond-langextract-gemma27b-noqualifiers-full-01
              NF: 2026-09-25-nfix-langextract-gemma27b-noqualifiers-full-01
              SM: 2026-09-25-supermat-langextract-gemma27b-noqualifiers-full-01
          - label: NuExtract3
            ids:
              PLW: 2026-09-25-pond-nuextract3-noqualifiers-full-01
              NF: 2026-09-25-nfix-nuextract3-noqualifiers-full-01
              SM: 2026-09-25-supermat-nuextract3-noqualifiers-full-01
          - label: ChatExtract
            ids:
              # Blank: ChatExtract extracts only material/value/unit, so pond's
              # ecosystem and nfix's ecosystem_type/substrate_type fuzzy fields are
              # always null and its best possible edge score (0.5 / 1/3) is below the
              # dataset fuzzy_threshold -- recovery 0 by construction, not measured.
              # Runs: 2026-09-26-{pond,nfix}-chatextract-gemma27b-full-01.
              PLW: null
              NF: null
              SM: 2026-09-26-supermat-chatextract-gemma27b-full-01
          - label: \texttt{llama-3.1-8b}
            ids:
              PLW: 2026-09-29-pond-ablation1-llama8b-reppen-cap100-noqualifiers-full-01
              NF: 2026-09-29-nfix-ablation1-llama8b-reppen-cap100-noqualifiers-full-01
              SM: 2026-09-26-supermat-ablation1-llama8b-reppen-noqualifiers-full-01
          - label: \texttt{gemma-3-27b}
            ids:
              PLW: 2026-09-25-pond-ablation1-gemma27b-noqualifiers-full-01
              NF: 2026-09-25-nfix-ablation1-gemma27b-noqualifiers-full-01
              SM: 2026-09-25-supermat-ablation1-gemma27b-noqualifiers-full-01
          - label: \texttt{gpt-oss-120b}
            ids:
              PLW: 2026-09-26-pond-ablation1-gptoss120b-noqualifiers-full-01
              NF: 2026-09-26-nfix-ablation1-gptoss120b-noqualifiers-full-01
              SM: 2026-09-26-supermat-ablation1-gptoss120b-noqualifiers-full-01
      - rows:
          - label: Pipeline (\texttt{llama-3.1-8b})
            ids:
              PLW: 2026-09-26-pond-extraction-llama8b-reppen-full-01
              NF: 2026-09-26-nfix-extraction-llama8b-reppen-full-01
              SM: 2026-09-26-supermat-extraction-llama8b-reppen-full-01
          - label: Pipeline (\texttt{gemma-3-27b})
            ids:
              PLW: 2026-09-22-pond-extraction-gemma27b-parseqty-standardization-valueonly-01
              NF: 2026-09-21-nfix-extraction-gemma27b-full-01
              SM: 2026-09-21-supermat-extraction-gemma27b-full-01
          - label: Pipeline (\texttt{gpt-oss-120b})
            ids:
              PLW: 2026-09-21-pond-extraction-gptoss120b-full-01
              NF: 2026-09-25-nfix-extraction-gptoss120b-full-02
              SM: 2026-09-21-supermat-extraction-gptoss120b-full-01
