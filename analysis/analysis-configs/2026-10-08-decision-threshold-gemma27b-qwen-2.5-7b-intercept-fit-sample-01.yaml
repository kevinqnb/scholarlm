id: 2026-10-08-decision-threshold-gemma27b-qwen-2.5-7b-intercept-fit-sample-01
project: scholarlm
description: >
  Recovery-validity curves over a decision threshold (keep rows with p >= t) on the
  recalibrated probe and NTP probabilities of the v4 intercept-fit sample calibration run,
  within-dataset cells only. Scored on the test documents only (fit-pool and probe
  synthetic-training documents have no predictions), so t=0 is recovery_validity's score
  on those documents, not the published all-document number.
  Run: bash analysis/submit.sh decision_threshold 2026-10-08-decision-threshold-gemma27b-qwen-2.5-7b-intercept-fit-sample-01 --walltime 02:00:00 --omp 4
seed: 0
params:
  calibration_config_id: 2026-10-08-calibration-v4-gemma27b-qwen-2.5-7b-intercept-fit-sample-01
  cells:
    - {train: pond, test: pond}
    - {train: nfix, test: nfix}
    - {train: supermat, test: supermat}
  thresholds: [0.0, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5,
               0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 1.0]
  highlight_threshold: 0.5
  n_permutations: 100
  invalid_datasets:
    supermat: >-
      calibration predictions use the pre-v3s supermat probe/test split, which does not
      match the validation sets' split; supermat numbers are invalid until a v3s rerun
