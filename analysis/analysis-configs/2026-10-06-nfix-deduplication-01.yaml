id: 2026-10-06-nfix-deduplication-01
project: scholarlm
description: >
  Deduplicated nfix extraction: exact weighted correlation clustering
  (separate cost max(w - tau, 0), join cost max(tau - w, 0), tau = the dataset
  config's fuzzy_threshold; non-strict-equal pairs forbidden) over the duplicate
  graph cached by 2026-10-06-nfix-deduplicate-cache-01, keeping each cluster's
  center (highest mean cached weight to the other members; ties to the lowest
  measurement_id) with the cluster's provenance lists merged into it. seed is
  required by the analysis-config envelope and unused (the solve is deterministic).
seed: 342
