id: 2026-10-06-ablations-recovery-validity-latex-01
project: scholarlm
description: >
  LaTeX table of recovery / validity (+ paper-clustered bootstrap interval) for ablations 2-5 and 7,
  one column per dataset (pond, nfix), read from the 2026-10-06-{pond,nfix}-ablations-recovery-01 result CSVs.
  Formatting only; seed is required by the analysis-config envelope and is unused here.
  Supermat dropped 2026-10-07: ablations 2-5 were never run on it, so it is not part of this experiment.
  Null cells (2026-10-07): pond ablation 4 llama (run in progress); pond ablation 3 llama and
  nfix ablation 5 gptoss120b (judge_combine done 2026-10-07, match caches pending -- held out for now).
