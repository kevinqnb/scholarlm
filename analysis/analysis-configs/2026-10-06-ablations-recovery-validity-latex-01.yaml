  one column per dataset, read from the three 2026-10-06-*-ablations-recovery-01 result CSVs.
  Formatting only; seed is required by the analysis-config envelope and is unused here.
  Null cells = no run or no judging (supermat ablations 2-5; pond ablation 4 and 3 llama; nfix ablation 5 gptoss120b).
