id: 2026-10-08-platt-scaling-sweep-gemma27b-qwen-2.5-7b-platt-fit-nested-01
project: scholarlm
description: >
  Recalibration-sample-size sweep (analysis/platt_scaling.py), platt_fit, over the same probe / NTP
  calibrator / extractions / judge runs as 2026-10-08-calibration-v3-gemma27b-qwen-2.5-7b-platt-fit-nested-01.
  For each n in platt_ns and each (train probe, test dataset, method): 100 two-class recalibration
  fit samples drawn exactly as v3 draws them (single-class draws skipped), each crossed with 100
  test-document resamples (v3's); point = mean over fit samples of the un-resampled calibration
  error, interval = 2.5/97.5 percentiles over all 10,000 replicates. At n=100 the rows reproduce
  that v3 run's real cells. fit_platt is unregularized, so at small n a separable sample gives an
  extreme map; read the n=10 points with that in mind.
  Run: bash analysis/submit.sh platt_scaling 2026-10-08-platt-scaling-sweep-gemma27b-qwen-2.5-7b-platt-fit-nested-01 --walltime HH:MM:SS --omp N
seed: 0
