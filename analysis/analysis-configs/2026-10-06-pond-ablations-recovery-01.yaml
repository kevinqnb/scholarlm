id: 2026-10-06-pond-ablations-recovery-01
project: scholarlm
description: >
  Recovery/validity (fuzzy-threshold edges, paper-clustered bootstrap) for ablations 2-5 and 7 on pond.
  Ablations 2-5 are the 2026-10-02 regenerated full runs; ablation 7 is the 2026-09-26 run
  (llama = llama-3.1-8b-reppen; the non-reppen llama ablation7 run is unjudged).
  Same ground truth, seed and settings as 2026-10-05-pond-full-pipeline-vs-baselines-recovery-01.
  2026-10-06: postprocessed.json and judge_combine done for every listed id; match caches NOT yet built
  for the 2026-10-02 ids (recovery_validity.py will fail loud until `match_cache.py` runs).
  Excluded, no judge responses.json: pond ablation3 llama8b-reppen (judges not run).
  No run (omitted; null cell in the latex table): ablation4-llama8b-reppen.
seed: 342
params:
  ground_truth_file: data/pond/ground_truth_review.json
  experiment_ids:
    - 2026-09-26-pond-ablation7-gemma27b-full-01
    - 2026-09-26-pond-ablation7-gptoss120b-full-01
    - 2026-09-26-pond-ablation7-llama8b-reppen-full-01
    - 2026-10-02-pond-ablation2-gemma27b-full-01
    - 2026-10-02-pond-ablation2-gptoss120b-full-01
    - 2026-10-02-pond-ablation2-llama8b-reppen-full-01
    - 2026-10-02-pond-ablation3-gemma27b-full-01
    - 2026-10-02-pond-ablation3-gptoss120b-full-01
    - 2026-10-02-pond-ablation4-gemma27b-full-01
    - 2026-10-02-pond-ablation4-gptoss120b-full-01
    - 2026-10-02-pond-ablation5-gemma27b-full-01
    - 2026-10-02-pond-ablation5-gptoss120b-full-01
    - 2026-10-02-pond-ablation5-llama8b-reppen-full-01
  recovery_validity:
    n_resamples: 2000
    alpha: 0.05
    compute_validity: true
    output: analysis/results/recovery-validity/2026-10-06-pond-ablations-recovery-01.csv
